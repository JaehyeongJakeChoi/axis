    if (k) return { realized: k.realized || [], buys: Array.isArray(k.buys) ? k.buys : null, flows: k.flows || [], summary: k.flows_summary || null, income: Array.isArray(k.income) ? k.income : null };
    const L = S.kLedger;
    return L && Array.isArray(L.items) ? { realized: L.items, buys: Array.isArray(L.buys) ? L.buys : null, flows: L.flows || [], summary: L.flows_summary || null, income: Array.isArray(L.income) ? L.income : null } : null;
  }
  // 입금액 기준 손익: 지금 평가금액(보유 자산 + 예수금)에서 순입금액을 뺀 값. acct 로 계좌를 고른다.
  function depositSheet(acct) {
    const cur = current();
    if (!cur) return "";
    const up = upbitData(), kw = kiwoomData(), c = compute(cur.p), all = [...c.rows, ...c.hidden];
    const cashOf = (tag) => (cur.p.cash || []).filter((x) => String(x.id).includes(":" + tag + ":"))
      .reduce((a, x) => a + (x.ccy === "USD" ? (c.fx ? x.amount * c.fx : 0) : x.amount), 0);
    const valueOf = (test) => all.filter(test).reduce((a, h) => a + (h.value || 0), 0);
    const parts = [];
    if (up && up.summary && acct !== "kiwoom") parts.push({ key: "upbit", f: up.summary, flows: up.flows, value: valueOf((h) => h.cls === "crypto") + cashOf("upbit") });
    if (kw && kw.summary && acct !== "upbit") parts.push({ key: "kiwoom", f: kw.summary, flows: kw.flows, value: valueOf((h) => h.cls !== "crypto") + cashOf("kiwoom") });
    if (!parts.length) return "";
    const tot = (fn) => parts.reduce((a, x) => a + fn(x), 0);
    const net = tot((x) => x.f.net), value = tot((x) => x.value), pnl = value - net;
    const dep = tot((x) => x.f.deposit_krw), wd = tot((x) => x.f.withdraw_krw), coinNet = tot((x) => x.f.coin_in_krw - x.f.coin_out_krw);
    const coinCount = tot((x) => x.f.coin_count || 0), unknown = tot((x) => x.f.unknown || 0), staking = tot((x) => x.f.staking_count || 0);
    const flows = parts.flatMap((x) => x.flows.map((y) => ({ ...y, broker: x.key }))).sort((a, b) => (String(a.ts) < String(b.ts) ? 1 : -1));
    const hasKiwoom = parts.some((x) => x.key === "kiwoom");
    return `<div class="sheet"><details class="fold" id="h-deposit"${S.hOpen.deposit ? " open" : ""}>
      <summary>입금액 기준 손익 <span class="small muted num">${parts.map((x) => ACCT_LABEL[x.key]).join(" + ")} · <span class="${dir(pnl)}">${signWon(pnl)}</span></span></summary>
      <div style="display:flex;flex-direction:column;gap:16px">
      <div class="tiles">
        <div class="fig"><span class="label">손익</span><span class="value num ${dir(pnl)}">${signWon(pnl)}</span><span class="sub num ${dir(pnl)}">${net > 0 ? pct(pnl / net) : ""}</span></div>
        <div class="fig"><span class="label">순입금액</span><span class="value num">${won(net)}</span><span class="sub muted num">입금 ${won(dep)} − 출금 ${won(wd)}${coinCount ? ` · 코인 이동 ${signWon(coinNet)}` : ""}</span></div>
        <div class="fig"><span class="label">현재 평가금액</span><span class="value num">${won(value)}</span><span class="sub muted">보유 자산 + 예수금 · ${cur.live ? "실시간" : "스냅샷 기준"}</span></div>
        ${parts.length > 1 ? parts.map((x) => `<div class="fig"><span class="label">${ACCT_LABEL[x.key]}</span><span class="value num ${dir(x.value - x.f.net)}">${signWon(x.value - x.f.net)}</span><span class="sub muted num">순입금 ${won(x.f.net)}</span></div>`).join("") : ""}
      </div>
      <details id="h-flows"${S.hOpen.flows ? " open" : ""}><summary>입출금 내역 ${flows.length}건</summary>
        <div class="scroll" style="padding-top:10px"><table class="trades" style="min-width:520px"><thead><tr><th>날짜</th><th>계좌</th><th>구분</th><th>통화</th><th>수량</th><th>원화 금액</th></tr></thead><tbody>${
          flows.map((x) => `<tr><td class="num">${esc(String(x.ts || "").slice(0, 10))}</td><td>${ACCT_LABEL[x.broker]}</td><td><span class="tag">${x.kind === "deposit" ? "입금" : "출금"}</span>${x.round_trip ? ' <span class="small muted">스테이킹</span>' : ""}</td><td>${esc(x.currency)}</td>
            <td class="num">${x.currency === "KRW" ? "" : qtyText(x.amount)}</td><td class="num">${x.krw === null || x.krw === undefined ? '<span class="muted">환산 불가</span>' : (x.est ? "약 " : "") + won(x.krw)}</td></tr>`).join("")}</tbody></table></div>
      </details>
      <p class="small muted">지금까지 넣은 돈 대비 결과입니다. 실현 손익, 평가 손익, 수수료, 배당이 모두 반영됩니다.${coinCount ? ` 코인 입출금 ${coinCount}건은 그 무렵 시세로 환산한 추정값입니다.` : ""}${staking ? ` 스테이킹처럼 나갔다가 비슷한 수량으로 돌아온 코인 ${staking}건은 입출금에서 뺐습니다.` : ""}${hasKiwoom ? " 키움은 계좌로 이체된 입금과 출금만 셉니다(배당, 이자, 환전은 제외)." : ""}${unknown ? ` 원화로 환산하지 못한 ${unknown}건은 빠져 있습니다.` : ""}</p>
    </div></details></div>`;
  }
  // 업비트는 실제 체결 내역, 키움 매도는 증권사의 실현손익 조회, 나머지는 스냅샷의 수량 변화를 쓴다. 최신순.
  function allTrades() {
    const up = upbitData(), kw = kiwoomData(), out = [];
    for (const f of up ? up.fills : []) {
      const ts = String(f.ts || ""), buy = f.side === "buy";
      out.push({ key: cleanId("f_" + f.id), date: ts.slice(0, 10), time: ts.slice(11, 16), id: f.holding_id, name: f.name || f.symbol, cls: "crypto",
        buy, kind: buy ? "매수" : "매도", dq: buy ? f.qty : -f.qty, value: f.funds, price: f.price,
        realized: typeof f.realized === "number" ? f.realized : null, exact: true, note: f.note || "", broker: "upbit" });
    }
    for (const f of kw ? kw.realized : []) {
      out.push({ key: cleanId("f_" + f.id), date: String(f.ts || "").slice(0, 10), time: "", id: f.holding_id, name: f.name || f.symbol, cls: f.cls,
        buy: false, kind: "매도", dq: -f.qty, value: f.funds, price: f.price,
        realized: typeof f.realized === "number" ? f.realized : null, exact: !f.pending, note: f.pending ? "체결 확인 중" : "", broker: "kiwoom",
        usd: typeof f.realized_usd === "number" ? { price: f.price_usd, value: f.funds_usd, realized: f.realized_usd } : null });
    }
    for (const f of kw && kw.buys ? kw.buys : []) {           // 키움 매수 체결(위탁종합거래내역)
      out.push({ key: cleanId("f_" + f.id), date: String(f.ts || "").slice(0, 10), time: "", id: f.holding_id, name: f.name || f.symbol, cls: f.cls,
        buy: true, kind: "매수", dq: f.qty, value: f.funds, price: f.price, realized: null, exact: !f.pending, note: f.pending ? "체결 확인 중" : "", broker: "kiwoom",
        usd: typeof f.funds_usd === "number" ? { price: f.price_usd, value: f.funds_usd, realized: null } : null });
    }
    for (const t of detectTrades(S.snaps)) {
      if (up && t.cls === "crypto") continue;
      if (kw && t.cls !== "crypto" && !t.buy) continue;   // 키움 매도는 위에서 이미 넣었다
      if (kw && kw.buys && t.cls !== "crypto") continue;  // 키움 매수 체결이 있으면 수량 변화 추정은 쓰지 않는다
      out.push({ ...t, key: tradeKey(t), time: "", price: null, exact: false, broker: t.cls === "crypto" ? "upbit" : "kiwoom" });
    }
    out.sort((a, b) => (a.date + a.time < b.date + b.time ? 1 : a.date + a.time > b.date + b.time ? -1 : 0));
    return out;
  }
  // 계좌 밖에서 들어오고 나간 돈 (날짜, 원화). 수익률에서 입출금 효과를 빼는 데 쓴다.
  function externalFlows() {
    const out = [], up = upbitData(), kw = kiwoomData();
    for (const x of up ? up.flows : []) if (!x.round_trip && typeof x.krw === "number") out.push({ date: String(x.ts || "").slice(0, 10), krw: x.kind === "deposit" ? x.krw : -x.krw });
    for (const x of kw ? kw.flows : []) if (typeof x.krw === "number") out.push({ date: String(x.ts || "").slice(0, 10), krw: x.kind === "deposit" ? x.krw : -x.krw });
    return out;
  }
  function divUpcoming() {
    if (S.live && Array.isArray(S.live.div_upcoming)) return S.live.div_upcoming;
    return S.divDoc && Array.isArray(S.divDoc.items) ? S.divDoc.items : [];
  }
  function benchData() {
    if (S.live && S.live.bench && Object.keys(S.live.bench).length) return S.live.bench;
    return S.benchDoc && S.benchDoc.data ? S.benchDoc.data : null;
  }
  const BENCH = [
    { key: "spx", label: "S&P 500", color: "var(--s-us)" },
    { key: "kospi", label: "코스피", color: "var(--s-kr)" },
    { key: "btc", label: "비트코인", color: "var(--s-crypto)" },
  ];
  // 날짜 d 또는 그 이전 마지막 종가
  function closeOn(series, d) {
    const ds = series.dates; let lo = 0, hi = ds.length - 1, at = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (ds[mid] <= d) { at = mid; lo = mid + 1; } else hi = mid - 1; }
    return at >= 0 ? series.closes[at] : null;
  }
  const SRC_OF = { kr: "kiwoom_kr", us: "kiwoom_us", crypto: "upbit" };
  function coveredSources(snap) {
    if (Array.isArray(snap.sources)) return new Set(snap.sources);
    const set = new Set();                          // sources 가 없는 옛 스냅샷은 내용으로 추정한다
    for (const h of snap.holdings || []) set.add(SRC_OF[h.cls]);
    for (const c of snap.cash || []) {
      if (String(c.id).includes(":upbit:")) set.add("upbit");
      if (String(c.id).includes(":kiwoom:")) { set.add("kiwoom_kr"); set.add("kiwoom_us"); }
    }
    return set;
  }
  function detectTrades(snaps) {
    const out = [];
    const full = snaps.filter((s) => s.complete);
    for (let i = 1; i < full.length; i++) {
      const a = new Map((full[i - 1].holdings || []).map((h) => [h.id, h]));
      const b = new Map((full[i].holdings || []).map((h) => [h.id, h]));
      const fx = full[i].fx || full[i - 1].fx || 0;
      const ca = coveredSources(full[i - 1]), cb = coveredSources(full[i]);
      for (const id of new Set([...a.keys(), ...b.keys()])) {
        const ha = a.get(id), hb = b.get(id), qa = ha ? ha.qty : 0, qb = hb ? hb.qty : 0, dq = qb - qa;
        if (Math.abs(dq) <= Math.max(qa, qb) * 0.001) continue;
        const src = SRC_OF[(hb || ha).cls];
        if (!ca.has(src) || !cb.has(src)) continue;   // 두 스냅샷 모두에 연결돼 있던 계좌만 비교한다
        const ref = hb || ha, value = Math.abs(dq) * (ref.price || 0) * (ref.ccy === "USD" ? fx : 1);
        if (value < DUST_KRW) continue;
        let realized = null;                       // 체결 내역이 없는 계좌는 전날 평단가와 당일 시세로 추정한다
        if (dq < 0 && ha && ha.avg) {
          const sp = (hb && hb.price) || ha.price, r = ha.ccy === "USD" ? fx : 1;
          if (sp && r) realized = -dq * (sp - ha.avg) * r;
        }
        out.push({ date: full[i].date, id, name: ref.name, cls: ref.cls, dq, value, buy: dq > 0, realized,
          kind: qa === 0 ? "신규 매수" : qb === 0 ? "전량 매도" : dq > 0 ? "추가 매수" : "일부 매도" });
      }
    }
    return out.reverse();
  }

  function lineChart(points, label) {
    const W = 720, H = 220, L = 8, R = 56, T = 12, B = 24;
    const vals = points.map((d) => d.total);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo || Math.abs(hi) * 0.02 || 1) * 0.08; lo -= pad; hi += pad;
    const x = (i) => L + (points.length === 1 ? 0.5 : i / (points.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const path = points.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d.total).toFixed(1)}`).join("");
    const area = `${path}L${x(points.length - 1).toFixed(1)},${H - B}L${x(0).toFixed(1)},${H - B}Z`;
    const ticks = [lo, (lo + hi) / 2, hi].map((v) =>
      `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${W - R + 6}" y="${(y(v) + 4).toFixed(1)}">${compactWon(v)}</text>`).join("");
    const last = points.length - 1;
    const zero = lo < 0 && hi > 0 ? `<line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"/>` : "";
    return `<div class="chart" id="valueChart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} 추이, ${esc(dateLabel(points[0].date))}부터 ${esc(dateLabel(points[last].date))}까지">
      ${ticks}${zero}
      <path d="${area}" fill="var(--chart-fill)"/>
      <path d="${path}" fill="none" stroke="var(--chart-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line id="vcLine" y1="${T}" y2="${H - B}" stroke="var(--line-strong)" stroke-width="1" visibility="hidden"/>
      <circle id="vcDot" r="4.5" fill="var(--accent)" stroke="var(--chart-line)" stroke-width="2" cx="${x(last).toFixed(1)}" cy="${y(points[last].total).toFixed(1)}"/>
      <text x="${L}" y="${H - 6}">${esc(dateLabel(points[0].date))}</text>
      <text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(dateLabel(points[last].date))}</text>
      <rect id="vcHit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
    </svg></div>`;
  }
  function wireLineChart(points, fmt) {
    const hit = $("vcHit"); if (!hit) return;
    const W = 720, L = 8, R = 56, T = 12, B = 24, H = 220;
    const vals = points.map((d) => d.total); let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo || Math.abs(hi) * 0.02 || 1) * 0.08; lo -= pad; hi += pad;
    const move = (e) => {
      const box = hit.getBoundingClientRect(), t = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
      const i = Math.round(t * (points.length - 1)), d = points[i];

  // 벤치마크 비교: 내 수익률은 입출금 효과를 뺀 시간가중 수익률(스냅샷 사이 수익률을 곱해 이음)
  let benchState = null;
  function benchSheet(snaps) {
    benchState = null;
    const bench = benchData();
    const full = snaps.filter((x) => x.complete !== false && x.total > 0);
    const days = { "1m": 31, "3m": 92, all: 100000 }[S.range];
    const from = kstDate(Date.now() - Math.min(days, 365) * 86400000), to = kstDate(Date.now());   // 내 수익률이 없을 때 지수만 보여 줄 기간 (전체는 최근 1년)
    if (!bench) return `<div class="sheet"><h2>벤치마크 비교</h2><p class="muted">지수 시세를 아직 받지 못했습니다. Mac의 Claude 앱에서 Axis를 열면 불러옵니다.</p></div>`;
    const flows = externalFlows();
    // 내 수익률 지수 (첫 스냅샷 = 0%)
    const mine = [];
    if (full.length) {
      let idx = 1; mine.push({ date: full[0].date, v: 0 });
      for (let i = 1; i < full.length; i++) {
        const a = full[i - 1], b = full[i];
        const f = flows.filter((x) => x.date > a.date && x.date <= b.date).reduce((s, x) => s + x.krw, 0);
        idx *= (b.total - f) / a.total;
        mine.push({ date: b.date, v: idx - 1 });
      }
    }
    const start = full.length > 1 ? full[0].date : from, end = full.length > 1 ? full[full.length - 1].date : to;
    const lines = BENCH.filter((b) => bench[b.key] && bench[b.key].dates.length).map((b) => {
      const ser = bench[b.key], s0 = closeOn(ser, start) ? start : ser.dates.find((d) => d >= start), c0 = s0 ? closeOn(ser, s0) : null;
      const dates = full.length > 1 ? full.map((x) => x.date).filter((d) => d >= s0) : ser.dates.filter((d) => d >= s0 && d <= end);
      return { ...b, pts: c0 ? dates.map((d) => ({ date: d, v: (closeOn(ser, d) || c0) / c0 - 1 })) : [] };
    }).filter((l) => l.pts.length);
    const myRet = mine.length > 1 ? mine[mine.length - 1].v : null;
    const row = (label, color, v, strong) => `<li><span class="ln" style="background:${color}"></span>${strong ? `<strong>${label}</strong>` : label} <strong class="num ${dir(v || 0)}">${v === null ? "–" : pct(v)}</strong></li>`;
    const legend = `<ul class="blegend">${row("내 포트폴리오", "var(--chart-line)", myRet, true)}${lines.map((l) => row(l.label, l.color, l.pts[l.pts.length - 1].v)).join("")}</ul>`;
    const all = (mine.length > 1 ? [{ key: "mine", label: "내 포트폴리오", color: "var(--chart-line)", pts: mine, mineLine: true }] : []).concat(lines);
    let chart = "";
    if (all.some((l) => l.pts.length > 1)) {
      const W = 720, H = 220, L = 8, R = 56, T = 12, B = 24;
      const dates = [...new Set(all.flatMap((l) => l.pts.map((p) => p.date)))].sort();
      const vals = all.flatMap((l) => l.pts.map((p) => p.v));
      let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const pad = (hi - lo || 0.01) * 0.1; lo -= pad; hi += pad;
      const x = (d) => L + (dates.length === 1 ? 0.5 : dates.indexOf(d) / (dates.length - 1)) * (W - L - R);
      const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
      const ticks = [lo, (lo + hi) / 2, hi].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${W - R + 6}" y="${(y(v) + 4).toFixed(1)}">${pct(v)}</text>`).join("");
      const zero = `<line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"/>`;
      const paths = all.slice().reverse().map((l) => `<path d="${l.pts.map((p, i) => `${i ? "L" : "M"}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join("")}" fill="none" stroke="${l.color}" stroke-width="${l.mineLine ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
      chart = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="내 수익률과 지수 수익률 비교, ${esc(dateLabel(dates[0]))}부터 ${esc(dateLabel(dates[dates.length - 1]))}까지">
        ${ticks}${zero}${paths}
        <line id="bxLine" y1="${T}" y2="${H - B}" stroke="var(--line-strong)" stroke-width="1" visibility="hidden"/>
        <text x="${L}" y="${H - 6}">${esc(dateLabel(dates[0]))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(dateLabel(dates[dates.length - 1]))}</text>
        <rect id="bxHit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg></div>`;
      benchState = { all, dates, x, W, L, R };
    }
    const note = mine.length > 1
      ? `내 수익률은 입금과 출금 효과를 뺀 시간가중 수익률입니다. 스냅샷 사이의 수익률을 이어 붙였고, 스냅샷 시각이 날마다 조금씩 달라 근사치입니다.`
      : `내 수익률은 키움과 업비트가 함께 잡힌 스냅샷이 이틀치 이상 쌓이면 계산됩니다. 지금은 같은 기간 지수 수익률만 보여 줍니다.`;
    return `<div class="sheet">
      <div class="bar-head"><h2>벤치마크 비교 <span class="small muted">${esc(dateLabel(start))} ~ ${esc(dateLabel(end))}</span></h2></div>
      ${legend}${chart}
      <p class="small muted">${note} 지수는 일별 종가 기준이고 비트코인은 원화 가격입니다. S&P 500은 달러 지수라 환율 변동이 들어 있지 않습니다. 기간은 위의 기간 선택을 따릅니다.</p>
    </div>`;
  }
  function wireBench() {
    const hit = $("bxHit"); if (!hit || !benchState) return;

    const move = (e) => {
      const box = hit.getBoundingClientRect(), t = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
      const d = dates[Math.round(t * (dates.length - 1))], cx = x(d);
      $("bxLine").setAttribute("x1", cx); $("bxLine").setAttribute("x2", cx); $("bxLine").setAttribute("visibility", "visible");
      const lines = all.map((l) => { const p = l.pts.filter((q) => q.date <= d).pop(); return p ? `${l.label} ${pct(p.v)}` : null; }).filter(Boolean);
      showTip(`${dateLabel(d)}\n${lines.join("\n")}`, e.clientX, e.clientY);
    };
    hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);

  }

  function renderProfile() {

    const hs = (now.holdings || []).filter((h) => h.value > 0).sort((a, b) => b.value - a.value);
    const invested = hs.reduce((s, h) => s + h.value, 0);
    const top1 = hs[0] ? hs[0].value / now.total : 0;
    const top3 = hs.slice(0, 3).reduce((s, h) => s + h.value, 0) / now.total;

    const change = snaps.length > 1 ? now.total / first.total - 1 : null;
    const pnlOf = (snap) => {                       // 평단가가 있는 종목만으로 평가 손익과 매입 원가를 계산한다
      let pnl = 0, cost = 0;
      for (const h of snap.holdings || []) {
        if (!h.avg || !h.price) continue;

        if (typeof h.pnl_krw === "number") { pnl += h.pnl_krw; cost += h.ccy === "USD" && h.avg_krw ? h.qty * h.avg_krw : h.qty * h.avg * r; continue; }
        if (h.ccy === "USD" && h.avg_krw) { pnl += h.qty * (h.price * r - h.avg_krw); cost += h.qty * h.avg_krw; continue; }
        pnl += h.qty * (h.price - h.avg) * r; cost += h.qty * h.avg * r;

    };

      </div>
      <div class="sheet"><details class="fold" id="h-years"${S.hOpen.years ? " open" : ""}><summary>연도별 실현 손익 <span class="small muted num">${years.length}년 · <span class="${dir(sum(allKnown))}">${signWon(sum(allKnown))}</span></span></summary>
        <div class="scroll"><table class="trades" style="min-width:420px"><thead><tr><th>연도</th><th>매도</th><th>이익 · 손실</th>${inUsd ? `<th style="text-align:right">미국주식 (달러)</th>` : ""}<th style="text-align:right">실현 손익</th></tr></thead><tbody>${
          yearRows.map((r) => `<tr><td class="num" style="color:var(--ink)">${r.y}</td><td class="num">${r.n}건</td><td class="num">${r.n ? `${r.wins} · ${r.n - r.wins}` : "–"}</td>${inUsd ? `<td class="num ${dir(r.usd)}" style="text-align:right">${r.usdN ? signUsd(r.usd) : '<span class="muted">–</span>'}</td>` : ""}<td class="num ${dir(r.realized)}" style="text-align:right">${signWon(r.realized)}</td></tr>`).join("")}
          <tr><td style="color:var(--ink);font-weight:600">합계</td><td class="num">${allKnown.length}건</td><td class="num">${allKnown.filter((t) => t.realized > 0).length} · ${allKnown.filter((t) => t.realized <= 0).length}</td>${inUsd ? `<td class="num ${dir(usdSum(allKnown))}" style="text-align:right;font-weight:600">${signUsd(usdSum(allKnown))}</td>` : ""}<td class="num ${dir(sum(allKnown))}" style="text-align:right;font-weight:600">${signWon(sum(allKnown))}</td></tr>
        </tbody></table></div>
      </details></div>
      ${groups.length ? `<div class="sheet"><details class="fold" id="h-groups"${S.hOpen.groups ? " open" : ""}><summary>종목별 실현 손익 <span class="small muted num">${scopeLabel} · ${groups.length}종목</span></summary>
        <div class="scroll"><table class="trades" style="min-width:360px"><thead><tr><th>종목</th><th>매도</th><th style="text-align:right">실현 손익</th></tr></thead><tbody>${
        groups.map((g) => `<tr><td style="color:var(--ink)">${esc(g.name)}</td><td class="num">${g.n}건</td><td class="num ${dir(inUsd && g.isUsd ? g.usd : g.realized)}" style="text-align:right">${inUsd && g.isUsd ? signUsd(g.usd) : signWon(g.realized)}</td></tr>`).join("")}</tbody></table></div></details></div>` : ""}
      <div class="sheet"><details class="fold" id="h-trades"${S.hOpen.trades ? " open" : ""}><summary>매매 내역 <span class="small muted num">${scopeLabel} · ${scoped.length}건</span></summary>
        <div class="scroll"><table class="trades" style="min-width:700px"><thead><tr><th>날짜</th><th>종목</th><th>구분</th><th>수량</th><th>체결가</th><th>금액</th><th>실현 손익</th></tr></thead><tbody>${
          scoped.slice(0, 300).map((t) => `<tr><td class="num">${esc(t.date)}${t.time ? " " + esc(t.time) : ""}</td><td>${esc(t.name)}${acct === "all" ? `<span class="sym">${ACCT_LABEL[t.broker]}</span>` : ""}</td><td><span class="tag ${t.buy ? "buy" : "sell"}">${esc(t.kind)}</span></td>
            <td class="num">${sign(t.dq)}${qtyText(Math.abs(t.dq))}</td><td class="num">${t.usd && t.usd.price ? px(t.usd.price, "USD") : t.price ? px(t.price, "KRW") : '<span class="muted">–</span>'}</td><td class="num">${t.usd && t.usd.value ? usd(t.usd.value) : (t.exact ? "" : "약 ") + won(t.value)}</td>
            <td class="num ${dir((inUsd && t.usd ? t.usd.realized : t.realized) || 0)}">${t.buy ? "" : t.realized === null ? '<span class="muted">원가 미상</span>' : amt(t) + (t.exact ? "" : " 추정") + (t.note ? `<span class="two muted" data-tip="${esc(t.note)}">무상 취득분 포함</span>` : "")}</td></tr>`).join("")}</tbody></table></div>
        ${scoped.length > 300 ? `<p class="small muted">최근 300건만 표시합니다.</p>` : ""}</details></div>
      ${acct !== "upbit" ? taxSheet(everything, yr) + incomeSheet(yr) : ""}
      ${deposit}
      <p class="small muted">${inUsd ? "달러로 보면 미국주식 매도는 키움이 달러로 계산한 실현손익(환율 효과 제외)을 보여 줍니다. 합계와 그래프는 원화 기준입니다. " : ""}실현 손익은 매도 대금에서 수수료와 평균 매입 원가를 뺀 값입니다. 업비트는 실제 체결 내역으로 계산합니다. 키움은 증권사가 계산한 실현손익을 그대로 쓰며, 수수료와 세금이 빠져 있고 미국주식은 환율 변동을 포함한 원화 기준입니다. 증권사 실현손익 조회에 없는 매도(주로 2023년 이전과 일부 국내주식)는 거래내역의 매도 금액에서 그때까지 매수의 이동평균 원가를 빼서 계산했습니다. 키움 매수 내역은 증권사 거래내역(위탁종합거래내역)을 씁니다.</p>`;
    if (points.length > 1) wireLineChart(points, signWon);
  }

  // 해외주식 양도소득세 추정: 해외주식만 과세 대상. 국내주식과 코인은 구분해서 보여 준다.
  const TAX_DEDUCTION = 2500000, TAX_RATE = 0.22;
  function taxSheet(everything, yr) {
    const year = yr === "all" ? kstDate(Date.now()).slice(0, 4) : yr;
    const inYear = (t) => !t.buy && t.realized !== null && t.date.startsWith(year);
    const us = everything.filter((t) => inYear(t) && t.broker === "kiwoom" && t.cls === "us");
    const kr = everything.filter((t) => inYear(t) && t.broker === "kiwoom" && t.cls === "kr");
    const coin = everything.filter((t) => inYear(t) && t.broker === "upbit");
    if (!us.length && !kr.length && !coin.length) return "";
    const total = (l) => l.reduce((a, t) => a + t.realized, 0);
    const gains = us.filter((t) => t.realized > 0).reduce((a, t) => a + t.realized, 0);
    const losses = us.filter((t) => t.realized < 0).reduce((a, t) => a + t.realized, 0);
    const net = gains + losses, base = Math.max(0, net - TAX_DEDUCTION), tax = Math.round(base * TAX_RATE / 10) * 10;
    const used = Math.min(Math.max(net, 0), TAX_DEDUCTION), left = TAX_DEDUCTION - used;
    const meter = `<div class="meter" role="img" aria-label="기본공제 250만 원 중 ${won(used)} 사용">
      <span style="width:${(used / TAX_DEDUCTION * 100).toFixed(1)}%;background:var(--s-us)"></span></div>
      <div class="small muted num" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>기본공제 사용 ${won(used)}</span><span>남은 공제 ${won(left)} / 250만 원</span></div>`;
    const thisYear = year === kstDate(Date.now()).slice(0, 4);
    return `<div class="sheet">
      <div class="bar-head"><h2>해외주식 양도소득세 <span class="small muted">${year}년 · 추정</span></h2>${yr === "all" ? `<span class="small muted">연도를 고르면 그 해로 바뀝니다</span>` : ""}</div>
      <div class="tiles">
        <div class="fig"><span class="label">해외주식 순양도차익</span><span class="value num ${dir(net)}">${signWon(net)}</span><span class="sub muted num">이익 ${won(gains)} · 손실 ${won(Math.abs(losses))}</span></div>
        <div class="fig"><span class="label">과세표준</span><span class="value num">${won(base)}</span><span class="sub muted">순양도차익 − 기본공제 250만 원</span></div>
        <div class="fig"><span class="label">예상 세액</span><span class="value num">${won(tax)}</span><span class="sub muted">과세표준 × 22% (지방소득세 포함)</span></div>
      </div>
      ${meter}
      <div class="scroll"><table class="trades taxgrid" style="min-width:520px"><thead><tr><th>구분</th><th>매도</th><th style="text-align:right">실현 손익</th><th>양도소득세</th></tr></thead><tbody>
        <tr><td style="color:var(--ink);font-weight:600">해외주식 · 키움 미국</td><td class="num">${us.length}건</td><td class="num ${dir(total(us))}" style="text-align:right">${signWon(total(us))}</td><td>과세 대상. 위 추정에 들어갑니다.</td></tr>
        <tr><td style="color:var(--ink)">국내주식 · 키움 국내</td><td class="num">${kr.length}건</td><td class="num ${dir(total(kr))}" style="text-align:right">${signWon(total(kr))}</td><td>대주주가 아니면 비과세. 증권거래세는 매도할 때 이미 냈습니다.</td></tr>
        <tr><td style="color:var(--ink)">코인 · 업비트</td><td class="num">${coin.length}건</td><td class="num ${dir(total(coin))}" style="text-align:right">${signWon(total(coin))}</td><td>지금은 비과세. 가상자산 과세는 2027년 시행 예정으로 알려져 있으며 바뀔 수 있습니다.</td></tr>
      </tbody></table></div>
      <p class="small muted">추정치입니다. 키움이 계산한 원화 실현손익(매입·매도 당시 환율과 수수료 반영)으로 계산했고, 키움 외 다른 증권사의 해외주식 손익은 합산되지 않습니다. 양도 시점은 결제일 기준이라 연말 마지막 거래일 무렵의 매도는 다음 해로 잡힐 수 있습니다.${thisYear ? ` ${year}년분은 ${Number(year) + 1}년 5월에 신고합니다.` : ""} 실제 신고 전에는 증권사 양도소득세 계산 서비스나 세무 전문가로 확인하세요.</p>
    </div>`;
  }
  // 배당·이자: 키움 거래내역의 배당금·분배금·예탁금 이자. 외화는 지금 환율로 원화 환산한다.
  function incomeSheet(yr) {
    const kw = kiwoomData(), upcoming = divUpcoming();
    const rows = kw && kw.income ? kw.income.filter((x) => yr === "all" || String(x.ts || "").startsWith(yr)) : [];
    if (!rows.length && !upcoming.length) return "";
    const cur = current(), fx = cur && cur.p.fx && cur.p.fx.usdkrw ? cur.p.fx.usdkrw : null;
    const krwOf = (x, v) => (x.currency === "KRW" ? v : fx ? v * fx : 0);
    const group = (x) => (x.kind === "tax" ? (/배당/.test(x.memo || "") ? "dividend" : "interest") : x.kind);
    const sumBy = (g, f) => rows.filter((x) => group(x) === g).reduce((a, x) => a + krwOf(x, f(x)), 0);
    const divNet = sumBy("dividend", (x) => x.net), intNet = sumBy("interest", (x) => x.net);
    const taxPaid = rows.reduce((a, x) => a + krwOf(x, x.tax || 0), 0);
    const usdDiv = rows.filter((x) => group(x) === "dividend" && x.currency !== "KRW").reduce((a, x) => a + x.net, 0);
    const hasFx = rows.some((x) => x.currency !== "KRW");
    const byName = new Map();
    for (const x of rows.filter((x) => group(x) === "dividend" && x.kind !== "tax")) {
      const k = x.name || x.symbol || "기타", g = byName.get(k) || { name: k, n: 0, krw: 0, usd: 0, fc: false };
      g.n++; g.krw += krwOf(x, x.net); if (x.currency !== "KRW") { g.usd += x.net; g.fc = true; } byName.set(k, g);
    }
    const names = [...byName.values()].sort((a, b) => b.krw - a.krw);
    const scope = yr === "all" ? "전체 기간" : yr + "년";
    const KIND = { dividend: "배당", interest: "이자", tax: "세금 출금" };
    const amtText = (x, v) => (x.currency === "KRW" ? won(v) : usd(v) + (fx ? `<span class="two muted">약 ${won(v * fx)}</span>` : ""));
    const byDate = rows.slice().sort((a, b) => (String(a.ts) < String(b.ts) ? 1 : -1));
    const dateList = byDate.length ? `<details class="fold" id="h-incdates"${S.hOpen.incDates ? " open" : ""}><summary style="font-size:14px">날짜별 내역 <span class="small muted">${byDate.length}건</span></summary>
        <div class="scroll"><table class="trades" style="min-width:560px"><thead><tr><th>날짜</th><th>종목</th><th>구분</th><th style="text-align:right">세전</th><th style="text-align:right">세금</th><th style="text-align:right">세후</th></tr></thead><tbody>${
          byDate.map((x) => `<tr><td class="num">${esc(String(x.ts || "").slice(0, 10))}</td><td style="color:var(--ink)">${esc(x.name || (x.kind === "interest" ? "예탁금" : "–"))}${x.symbol ? `<span class="sym">${esc(x.symbol)}</span>` : ""}</td><td><span class="tag">${KIND[x.kind] || x.kind}</span>${x.currency !== "KRW" ? ` <span class="small muted">${esc(x.currency)}</span>` : ""}</td>
            <td class="num" style="text-align:right">${x.gross ? amtText(x, x.gross) : '<span class="muted">–</span>'}</td>
            <td class="num" style="text-align:right">${x.tax ? amtText(x, x.tax) : '<span class="muted">–</span>'}</td>
            <td class="num ${x.net < 0 ? "down" : ""}" style="text-align:right">${x.net < 0 ? "−" + amtText(x, -x.net) : amtText(x, x.net)}</td></tr>`).join("")}</tbody></table></div></details>` : "";
    const upList = upcoming.length ? `<div><h3>30일 안 배당 예정</h3>
        <div class="scroll" style="margin-top:8px"><table class="trades" style="min-width:560px"><thead><tr><th>배당락일</th><th>종목</th><th>근거</th><th style="text-align:right">주당</th><th style="text-align:right">예상 금액 (세전)</th></tr></thead><tbody>${
          upcoming.map((x) => `<tr><td class="num">${esc(x.ex)}${x.pay ? `<span class="two muted">지급 ${esc(x.pay)}</span>` : ""}</td><td style="color:var(--ink)">${esc(x.name)}<span class="sym">${esc(x.symbol)}</span></td>
            <td><span class="tag">${x.basis === "declared" ? "발표" : "추정"}</span>${x.basis === "projected" && x.interval_days ? ` <span class="small muted">약 ${Math.round(x.interval_days / 30)}개월 주기</span>` : ""}</td>
            <td class="num" style="text-align:right">${x.currency === "KRW" ? won(x.per_share) : usd(x.per_share)}</td>
            <td class="num" style="text-align:right">${x.currency === "KRW" ? won(x.est_amount) : usd(x.est_amount) + (fx ? `<span class="two muted">약 ${won(x.est_amount * fx)}</span>` : "")}</td></tr>`).join("")}</tbody></table></div>
        <p class="small muted" style="margin-top:6px">배당락일 전날까지 보유해야 받을 수 있습니다. '발표'는 회사가 공시한 일정이고, '추정'은 과거 배당 간격과 마지막 배당 금액으로 계산한 값이라 실제와 다를 수 있습니다. 금액은 지금 보유 수량 기준 세전이며, 미국 주식은 보통 15%가 원천징수됩니다.</p></div>` : "";
    if (!rows.length) return `<div class="sheet"><h2>배당·이자 <span class="small muted">${scope} · 키움</span></h2>${upList}</div>`;
    return `<div class="sheet">
      <h2>배당·이자 <span class="small muted">${scope} · 키움</span></h2>
      <div class="tiles">
        <div class="fig"><span class="label">배당금 (세후)</span><span class="value num">${hasFx ? "약 " : ""}${won(divNet)}</span><span class="sub muted num">${usdDiv ? `외화 배당 ${usd(usdDiv)} 포함` : "원화 배당"}</span></div>
        <div class="fig"><span class="label">예탁금 이자 (세후)</span><span class="value num">${won(intNet)}</span></div>
        <div class="fig"><span class="label">원천징수 세금</span><span class="value num">${hasFx ? "약 " : ""}${won(taxPaid)}</span><span class="sub muted">미국 배당 15% 등</span></div>
        <div class="fig"><span class="label">합계 (세후)</span><span class="value num up">${hasFx ? "약 " : ""}${won(divNet + intNet)}</span><span class="sub muted">${rows.length}건</span></div>
      </div>
      ${names.length ? `<details class="fold" id="h-income"${S.hOpen.income ? " open" : ""}><summary style="font-size:14px">종목별 배당 <span class="small muted">${names.length}종목</span></summary>
        <div class="scroll"><table class="trades" style="min-width:360px"><thead><tr><th>종목</th><th>입금</th><th style="text-align:right">배당 (세후)</th></tr></thead><tbody>${
          names.map((g) => `<tr><td style="color:var(--ink)">${esc(g.name)}</td><td class="num">${g.n}건</td><td class="num" style="text-align:right">${g.fc ? usd(g.usd) + `<span class="two muted">약 ${won(g.krw)}</span>` : won(g.krw)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
      ${dateList}
      ${upList}
      <p class="small muted">세금을 뗀 뒤 계좌에 들어온 금액입니다. 외화는 입금 당시가 아니라 지금 환율로 환산한 값이라 '약'으로 표시했습니다. 국내 배당은 증권사가 세후 금액만 알려 줘서 원천징수 세금에 포함되지 않았습니다. 쿠폰 같은 이벤트 입금은 넣지 않았습니다.</p>
    </div>`;
  }

  // ── 매매 통계: 포지션 기준 ─────────────────────────────
  // 한 건 = 보유 수량이 0에서 시작해 다시 0이 될 때까지. 그 사이 분할 매수·분할 매도는 한 건으로 합친다.
  // 업비트 체결과 키움 매수·실현손익만 쓴다(스냅샷 추정과 '체결 확인 중' 임시 행은 뺀다).
  function positionTrades() {
    const up = upbitData(), kw = kiwoomData(), by = new Map();
    const add = (id, e) => { if (!id) return; if (!by.has(id)) by.set(id, []); by.get(id).push(e); };
    for (const f of up ? up.fills : []) add(f.holding_id, { ts: String(f.ts || ""), buy: f.side === "buy", qty: f.qty, realized: f.side === "buy" ? null : f.realized, name: f.name || f.symbol });
    for (const b of kw && kw.buys ? kw.buys : []) if (!b.pending) add(b.holding_id, { ts: String(b.ts || ""), buy: true, qty: b.qty, realized: null, name: b.name || b.symbol });
    for (const r of kw ? kw.realized : []) if (!r.pending) add(r.holding_id, { ts: String(r.ts || ""), buy: false, qty: r.qty, realized: r.realized, name: r.name || r.symbol });
    const closed = [], open = [];
    for (const [id, es] of by) {
      es.sort((a, b) => (a.ts.slice(0, 10) === b.ts.slice(0, 10) && a.buy !== b.buy ? (a.buy ? -1 : 1) : a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0));
      let q = 0, cur = null;
      for (const e of es) {
        if (!cur) cur = { id, name: e.name, start: e.ts.slice(0, 10), end: null, pnl: 0, sells: 0, unknown: false };
        if (e.buy) q += e.qty;
        else {
          q = Math.max(0, q - e.qty); cur.sells++; cur.end = e.ts.slice(0, 10); cur.name = e.name;   // 매도 쪽 이름이 띄어쓰기가 맞다
          if (typeof e.realized === "number") cur.pnl += e.realized; else cur.unknown = true;
        }
        if (q < 1e-6 && cur.sells) { closed.push(cur); cur = null; q = 0; }
      }
      if (cur && cur.sells) open.push(cur);
    }
    return { closed: closed.filter((c) => !c.unknown).sort((a, b) => (a.end < b.end ? -1 : 1)), open };
  }
  function tradeStats() {
    const { closed, open } = positionTrades();
    if (!closed.length) return null;
    const wins = closed.filter((c) => c.pnl > 0), losses = closed.filter((c) => c.pnl <= 0);
    const sum = (l) => l.reduce((a, c) => a + c.pnl, 0), mean = (l) => (l.length ? sum(l) / l.length : 0);
    const days = (c) => Math.round((Date.parse(c.end) - Date.parse(c.start)) / 86400000);
    const median = (l) => { if (!l.length) return null; const v = l.slice().sort((a, b) => a - b), m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
    let streak = 0, maxStreak = 0, acc = 0, peak = 0, peakAt = closed[0].start, mdd = 0, mddFrom = null, mddTo = null;
    for (const c of closed) {
      streak = c.pnl <= 0 ? streak + 1 : 0; maxStreak = Math.max(maxStreak, streak);
      acc += c.pnl;
      if (acc > peak) { peak = acc; peakAt = c.end; }
      if (acc - peak < mdd) { mdd = acc - peak; mddFrom = peakAt; mddTo = c.end; }
    }
    const pnls = closed.map((c) => c.pnl), avg = mean(closed);
    const sd = Math.sqrt(pnls.reduce((a, v) => a + (v - avg) ** 2, 0) / pnls.length);
    const worst3 = losses.slice().sort((a, b) => a.pnl - b.pnl).slice(0, 3);
    return { n: closed.length, wins, losses, winRate: wins.length / closed.length, avgWin: mean(wins), avgLoss: mean(losses),
      payoff: losses.length && mean(losses) ? mean(wins) / Math.abs(mean(losses)) : null, pf: sum(losses) ? sum(wins) / Math.abs(sum(losses)) : null,
      expectancy: avg, holdWin: median(wins.map(days)), holdLoss: median(losses.map(days)), maxStreak, mdd, mddFrom, mddTo,
      worst3, worstShare: sum(losses) ? sum(worst3) / sum(losses) : 0, sqn: sd ? Math.sqrt(Math.min(pnls.length, 100)) * avg / sd : null,
      open, openPnl: open.reduce((a, c) => a + c.pnl, 0) };
  }
  function statsSheet() {
    const t = tradeStats();
    if (!t) return "";
    const sells = allTrades().filter((x) => !x.buy && x.realized !== null && x.exact);
    const sw = sells.filter((x) => x.realized > 0), sl = sells.filter((x) => x.realized <= 0);
    const perSell = sw.length && sl.length ? (sw.reduce((a, x) => a + x.realized, 0) / sw.length) / Math.abs(sl.reduce((a, x) => a + x.realized, 0) / sl.length) : null;
    const fig = (label, value, sub, cls) => `<div class="fig"><span class="label">${label}</span><span class="value num ${cls || ""}">${value}</span>${sub ? `<span class="sub muted">${sub}</span>` : ""}</div>`;
    return `<div class="sheet"><h2>매매 통계 <span class="small muted">포지션 기준 ${t.n}건</span></h2><div class="tiles">
      ${fig("승률", share(t.winRate), `이익 ${t.wins.length}건 · 손실 ${t.losses.length}건`)}
      ${fig("손익비", f2(t.payoff), `평균 이익 ${compactWon(t.avgWin)} · 평균 손실 ${compactWon(Math.abs(t.avgLoss))}`)}
      ${fig("프로핏 팩터", f2(t.pf), "총이익 ÷ 총손실 · 1 미만이면 순손실", t.pf !== null && t.pf < 1 ? "down" : "up")}
      ${fig("기대값", signWon(t.expectancy), "한 건당 평균 실현 손익", dir(t.expectancy))}
      ${fig("보유 기간", `${t.holdWin ?? "–"}일 · ${t.holdLoss ?? "–"}일`, "중앙값, 이익 난 매매 · 손실 난 매매")}
      ${fig("최대 연속 손실", `${t.maxStreak}건`, "청산 순서 기준")}
      ${fig("실현 손익 최대 낙폭", signWon(t.mdd), t.mddFrom ? `${esc(t.mddFrom)} 고점 → ${esc(t.mddTo)}` : "", "down")}
      ${fig("큰 손실 집중도", share(t.worstShare), `손실 상위 3건 · ${esc(t.worst3.map((c) => c.name).join(", "))}`)}
      ${fig("SQN", f2(t.sqn), "반 타프 지표 · 0 미만이면 기대값이 음수", t.sqn !== null && t.sqn < 0 ? "down" : "")}
    </div>
    <p class="small muted">한 건은 보유 수량이 0에서 시작해 다시 0이 될 때까지입니다. 그 사이의 분할 매수와 분할 매도는 한 건으로 합칩니다(Tradervue 같은 매매일지 도구의 방식). 손익비 = 평균 이익 ÷ 평균 손실, 프로핏 팩터 = 총이익 ÷ 총손실, SQN = √건수(최대 100) × 기대값 ÷ 표준편차입니다.${t.open.length ? ` 아직 보유 중이라 끝나지 않은 ${t.open.length}종목(${esc(t.open.map((c) => c.name).join(", "))})의 일부 매도 손익 ${signWon(t.openPnl)}은 빠져 있습니다.` : ""}${perSell !== null ? ` 참고로 매도 한 번을 한 건으로 세면 손익비는 ${f2(perSell)}입니다.` : ""} 업비트 체결과 키움 실현손익·매수 내역으로 계산했습니다.</p></div>`;
  }

  // ── 포트폴리오 위험 지표 ──────────────────────────────
  // A: 서버가 지금 비중을 최근 1년 시세에 대입해 계산한 값(S.live.risk, 다른 기기에서는 저장소의 risk/latest).
  // B: 실제 계좌의 일별 스냅샷으로 계산한 값. 입출금 효과를 뺀 시간가중 수익률을 쓴다.
  function riskData() {
    if (S.live && S.live.risk) return S.live.risk;
    return S.riskDoc && S.riskDoc.data ? S.riskDoc.data : null;
  }
  const pctOrDash = (v) => (typeof v === "number" ? pct(v) : "–");
  const f2 = (v) => (typeof v === "number" ? v.toFixed(2) : "–");
  const plainPct = (v) => (typeof v === "number" ? (v * 100).toFixed(1) + "%" : "–");
  function riskSheet() {

    const fig = (label, value, sub, cls) => `<div class="fig"><span class="label">${label}</span><span class="value num ${cls || ""}">${value}</span>${sub ? `<span class="sub muted">${sub}</span>` : ""}</div>`;
    const vs = r.vs_spx, vk = r.vs_kospi, m = r.mine;
    return `<div class="sheet"><h2>포트폴리오 위험 <span class="small muted">지금 구성 · ${esc(r.start)} ~ ${esc(r.end)}</span></h2>
      <div class="scroll"><table class="trades" style="min-width:620px"><thead><tr><th></th><th>연 수익률</th><th>변동성</th><th>샤프</th><th>소르티노</th><th>최대 낙폭</th><th>칼마</th></tr></thead><tbody>
        ${row("<strong>지금 구성</strong>", m)}${row("S&P 500 (원화)", r.spx)}${row("코스피", r.kospi)}</tbody></table></div>
      <div class="tiles">
        ${fig("베타 · S&P 500", f2(vs.beta), `상관 ${f2(vs.corr)} · 시장이 1% 움직이면 약 ${f2(vs.beta)}%`)}
        ${fig("베타 · 코스피", f2(vk.beta), `상관 ${f2(vk.corr)}`)}
        ${fig("알파 (S&P 500 대비)", pctOrDash(vs.alpha), "베타로 설명되지 않는 연 초과 수익", dir(vs.alpha || 0))}
        ${fig("정보비율", f2(vs.ir), "S&P 500 대비 초과 수익 ÷ 추적 오차")}

        ${fig("하루 VaR (95%)", won(r.var95_krw), `${plainPct(m.var95)} · 20일에 한 번꼴로 이보다 크게 잃는 날`, "down")}
        ${fig("하루 CVaR (95%)", won(r.cvar95_krw), `${plainPct(m.cvar95)} · 그런 날의 평균 손실`, "down")}
        ${fig("분산 비율", f2(r.div_ratio), `종목 간 평균 상관 ${f2(r.avg_corr)} · 1에 가까우면 분산 효과 없음`)}
      </div>
      <div class="scroll"><table class="trades" style="min-width:420px"><thead><tr><th>위험 기여 상위</th><th style="text-align:right">비중</th><th style="text-align:right">위험 기여</th></tr></thead><tbody>${
        r.contrib.map((c) => `<tr><td style="color:var(--ink)">${esc(c.name)}</td><td class="num" style="text-align:right">${plainPct(c.weight)}</td><td class="num" style="text-align:right">${plainPct(c.risk)}</td></tr>`).join("")}</tbody></table></div>
      ${r.top_pairs.length ? `<p class="small">같이 움직이는 종목: ${r.top_pairs.map((x) => `${esc(x.a)}·${esc(x.b)} <span class="num muted">${f2(x.corr)}</span>`).join(" · ")}</p>` : ""}
      <p class="small muted">지금 들고 있는 종목을 지금 비중 그대로 최근 ${r.days}거래일 동안 들고 있었다고 가정한 값입니다. 실제 성과가 아니라 지금 구성이 얼마나 출렁이는지를 보여 줍니다. 미국 주식과 S&P 500은 그날 원/달러 환율로 원화 환산했고, 무위험 금리는 미국 3개월 국채 ${plainPct(r.rf)}를 썼습니다. 위험 기여는 포트폴리오 변동(분산)에서 각 종목이 차지하는 몫입니다. 한국과 미국은 장 시간이 달라 일별 상관과 베타가 실제보다 낮게 나올 수 있습니다.${(r.excluded || []).length ? ` 1년 시세가 부족한 ${esc(r.excluded.map((x) => x.name).join(", "))}은 빼고 계산했습니다.` : ""}</p></div>`;
  }
  // 보완 후보: 지금 구성과 다르게 움직이는 자산. 같은 조건(지금 구성 90% + 후보 10%)으로 지난 1년 위험을 비교한다.
  function complementSheet() {
    const r = riskData();
    if (!r || !Array.isArray(r.complements) || !r.complements.length) return "";
    const base = r.cash_mix, m = r.mine;
    const better = (v, b, hi) => (typeof v === "number" && typeof b === "number" && (hi ? v > b : v < b) ? "better" : "");
    const row = (c) => `<tr><td style="color:var(--ink)">${esc(c.name)}<span class="sym">${esc(c.group)}</span></td>

      <td class="num ${better(c.mix_vol, base.vol)}">${plainPct(c.mix_vol)}</td><td class="num ${better(-c.mix_mdd, -base.mdd)}">${pct(c.mix_mdd)}</td><td class="num ${better(c.mix_sharpe, base.sharpe, true)}">${f2(c.mix_sharpe)}</td></tr>`;

      <tr style="background:var(--wash)"><td style="color:var(--ink)">기준: 10%를 현금으로</td><td></td><td></td><td></td><td></td><td class="num">${plainPct(base.vol)}</td><td class="num">${pct(base.mdd)}</td><td class="num">${f2(base.sharpe)}</td></tr>`;
    const list = r.complements, top = list.slice(0, 12), rest = list.slice(12);

      <p class="small">${beat.length ? `현금 10%보다 최대 낙폭과 샤프가 모두 나았던 자산: ${esc(beat.map((c) => c.name).join(", "))}` : "현금 10%보다 최대 낙폭과 샤프가 모두 나았던 자산은 없습니다."}</p>

  }
  const ACTUAL_MIN = 20;   // 실제 계좌 지표를 보여 주기 시작하는 일별 기록 수
  function actualSheet() {
    const full = S.snaps.filter((x) => x.complete !== false && x.total > 0 && x.date >= FULL_FROM);
    const n = Math.max(0, full.length - 1);
    if (n < ACTUAL_MIN) return `<div class="sheet"><h2>실제 계좌 성과 <span class="small muted">일별 기록 ${n}/${ACTUAL_MIN}일</span></h2>
      <div class="meter" role="img" aria-label="일별 기록 ${n}일 / ${ACTUAL_MIN}일"><span style="width:${(n / ACTUAL_MIN * 100).toFixed(1)}%;background:var(--accent)"></span></div>
      <p class="small muted">키움과 업비트가 함께 잡힌 일별 기록이 ${ACTUAL_MIN}일 이상 쌓이면 실제 계좌 기준 변동성, 샤프, 소르티노, 최대 낙폭, 베타를 계산합니다. ${esc(dateLabel(FULL_FROM))}부터 셉니다. 3개월(약 60일) 이상이 되어야 믿을 만한 숫자가 됩니다.</p></div>`;
    const flows = externalFlows(), r = [];
    for (let i = 1; i < full.length; i++) {
      const a = full[i - 1], b = full[i];
      const f = flows.filter((x) => x.date > a.date && x.date <= b.date).reduce((s, x) => s + x.krw, 0);
      r.push((b.total - f) / a.total - 1);
    }
    const daysSpan = (Date.parse(full[full.length - 1].date) - Date.parse(full[0].date)) / 86400000;
    const perYear = n / (daysSpan / 365);
    const mean = r.reduce((a, x) => a + x, 0) / n, sd = Math.sqrt(r.reduce((a, x) => a + (x - mean) ** 2, 0) / (n - 1));
    let nav = 1, peak = 1, mdd = 0;
    for (const x of r) { nav *= 1 + x; peak = Math.max(peak, nav); mdd = Math.min(mdd, nav / peak - 1); }
    const rk = riskData(), rf = rk ? rk.rf : 0;
    const ann = Math.pow(nav, 365 / daysSpan) - 1, vol = sd * Math.sqrt(perYear);
    const down = Math.sqrt(r.reduce((a, x) => a + Math.min(x, 0) ** 2, 0) / n) * Math.sqrt(perYear);
    const bench = benchData(), beta = (key) => {
      const ser = bench && bench[key]; if (!ser) return null;
      const m = []; for (let i = 1; i < full.length; i++) { const c0 = closeOn(ser, full[i - 1].date), c1 = closeOn(ser, full[i].date); m.push(c0 && c1 ? c1 / c0 - 1 : 0); }
      const mm = m.reduce((a, x) => a + x, 0) / n, vm = m.reduce((a, x) => a + (x - mm) ** 2, 0) / (n - 1);
      return vm ? r.reduce((a, x, i) => a + (x - mean) * (m[i] - mm), 0) / (n - 1) / vm : null;
    };
    const fig = (label, value, sub, cls) => `<div class="fig"><span class="label">${label}</span><span class="value num ${cls || ""}">${value}</span>${sub ? `<span class="sub muted">${sub}</span>` : ""}</div>`;
    return `<div class="sheet"><h2>실제 계좌 성과 <span class="small muted">${esc(dateLabel(full[0].date))} ~ ${esc(dateLabel(full[full.length - 1].date))} · 일별 기록 ${n}일</span></h2><div class="tiles">
      ${fig("누적 수익률", pct(nav - 1), `연 환산 ${pct(ann)}`, dir(nav - 1))}
      ${fig("변동성", plainPct(vol), "연 환산")}
      ${fig("샤프", f2(vol ? (mean * perYear - rf) / vol : null), `소르티노 ${f2(down ? (mean * perYear - rf) / down : null)}`)}
      ${fig("최대 낙폭", pct(mdd), "", "down")}
      ${fig("베타", `${f2(beta("spx"))} · ${f2(beta("kospi"))}`, "S&P 500(달러) · 코스피")}
    </div><p class="small muted">입금과 출금 효과를 뺀 시간가중 수익률입니다. 스냅샷 시각이 날마다 조금씩 달라 근사치이고, ${n < 60 ? "기록이 60일이 안 돼 아직 들쭉날쭉할 수 있습니다." : "기록이 길어질수록 안정됩니다."}</p></div>`;
  }

  // ── Lab 탭: 투자 성향 분석과 성향에 맞는 관찰 후보 ──────
  // 위쪽 지표는 페이지가 기록에서 직접 계산하고, 성향 해석과 후보 목록은 Claude가 lab/{날짜} 문서로 기록한다.
  function renderLab() {
    const el = $("panel-lab");
    const cur = current(), c = cur ? compute(cur.p) : null;
    const d90 = kstDate(Date.now() - 90 * 86400000), recent = allTrades().filter((t) => t.date >= d90);
    const top3 = c && c.total ? c.rows.slice(0, 3).reduce((a, r) => a + r.value, 0) / c.total : null;
    const fig = (label, value, sub) => `<div class="fig"><span class="label">${label}</span><span class="value num">${value}</span>${sub ? `<span class="sub muted">${sub}</span>` : ""}</div>`;
    const habits = `${statsSheet()}${riskSheet()}${complementSheet()}${actualSheet()}<div class="sheet"><h2>기록으로 본 습관</h2><div class="tiles">
      ${fig("최근 90일 매매", `${recent.length}건`, `매수 ${recent.filter((t) => t.buy).length} · 매도 ${recent.filter((t) => !t.buy).length}`)}
      ${c ? fig("상위 3종목 비중", share(top3), esc(c.rows.slice(0, 3).map((r) => r.name).join(", "))) : ""}
      ${c && c.total ? fig("미국주식 · 코인 비중", `${share(c.byClass.us / c.total)} · ${share(c.byClass.crypto / c.total)}`, `국내 ${share(c.byClass.kr / c.total)} · 현금 ${share(c.byClass.cash / c.total)}`) : ""}
    </div></div>`;

    if (!S.lab.length) {
      el.innerHTML = `${habits}<div class="sheet"><h2>성향 분석이 아직 없습니다</h2>
        <p class="prose">Claude가 보유 종목과 매매 기록을 읽고 투자 성향을 정리한 뒤, 지금 구성과 다르게 움직이는 자산을 모아 이곳에 올립니다. 매주 일요일 아침 브리핑 때 새로 갱신됩니다.</p></div>`;
      return;
    }
    const L = S.lab.find((x) => x.date === S.labDate) || S.lab[0];
    const chips = datePicker("lab", S.lab.map((x) => x.date), L.date, "분석 날짜");
    const traits = (L.traits || []).map((t) => `<div class="trait"><span class="t">${esc(t.label)}</span><span>${esc(t.text)}</span>${t.evidence ? `<span class="small muted">${esc(t.evidence)}</span>` : ""}</div>`).join("");
    const themes = (L.themes || []).map((t) => `<div class="theme-row"><div><strong>${esc(t.name)}</strong>${typeof t.share === "number" ? ` <span class="num muted">${share(t.share)}</span>` : ""}</div>
      <div class="small">${esc((t.holdings || []).join(", "))}${t.note ? `<span class="muted"> · ${esc(t.note)}</span>` : ""}</div></div>`).join("");
    // 코인 분석: Claude가 업비트 체결 내역으로 쓴 L.crypto
    const C = L.crypto;
    const cryptoSheet = C ? `<div class="sheet"><h2>코인 <span class="small muted">${esc(C.basis || "업비트 체결 기준")}</span></h2>
      ${C.headline ? `<p style="font-size:18px;font-weight:600;letter-spacing:-0.02em">${esc(C.headline)}</p>` : ""}
      ${C.summary ? `<p class="prose">${esc(C.summary)}</p>` : ""}
      ${(C.stats || []).length ? `<div class="tiles">${C.stats.map((x) => `<div class="fig"><span class="label">${esc(x.label)}</span><span class="value num">${esc(x.value)}</span>${x.sub ? `<span class="sub muted">${esc(x.sub)}</span>` : ""}</div>`).join("")}</div>` : ""}
      ${(C.notes || []).length ? `<div class="traits">${C.notes.map((t) => `<div class="trait"><span class="t">${esc(t.label)}</span><span>${esc(t.text)}</span>${t.evidence ? `<span class="small muted">${esc(t.evidence)}</span>` : ""}</div>`).join("")}</div>` : ""}
      ${(C.coins || []).length ? `<div class="scroll"><table class="trades" style="min-width:480px"><thead><tr><th>코인</th><th>매수 · 매도</th><th>기간</th><th style="text-align:right">실현 손익</th></tr></thead><tbody>${
        C.coins.map((c) => `<tr><td style="color:var(--ink)">${esc(c.name)}</td><td class="num">${esc(c.trades)}</td><td class="num">${esc(c.period || "")}</td><td class="num ${dir(c.realized || 0)}" style="text-align:right">${typeof c.realized === "number" ? signWon(c.realized) : "–"}</td></tr>`).join("")}</tbody></table></div>` : ""}
      ${(C.practice || []).length ? `<div><h3>연습해 볼 것</h3><ul class="plain" style="margin-top:8px">${C.practice.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    </div>` : "";
    const groups = new Map();
    for (const p of L.picks || []) { const k = p.theme || "기타"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); }
    const picks = [...groups].map(([theme, items]) => `<div class="news-group"><h3>${esc(theme)}</h3><div class="picks">${items.map((p) => {
      const u = safeUrl(p.url);
      return `<div class="pick"><div class="head"><strong>${esc(p.name)}</strong><span class="small muted">${esc([p.symbol, p.market].filter(Boolean).join(" · "))}</span></div>
        <span>${esc(p.why)}</span>${p.facts ? `<span class="small muted">${esc(p.facts)}</span>` : ""}
        ${u ? `<a class="small" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(p.source || "출처")}</a>` : ""}</div>`;
    }).join("")}</div></div>`).join("");
    el.innerHTML = `${chips}
      <div class="sheet">
        <p class="small muted">${esc(dateLabel(L.date))} 분석${L.basis ? " · " + esc(L.basis) : ""}</p>
        <p class="headline">${esc(L.headline || "투자 성향")}</p>
        ${L.summary ? `<p class="prose">${esc(L.summary)}</p>` : ""}
        ${traits ? `<div class="traits">${traits}</div>` : ""}
      </div>
      ${habits}
      ${cryptoSheet}
      ${themes ? `<div class="sheet"><h2>테마별 노출</h2><div>${themes}</div></div>` : ""}
      ${picks ? `<div class="sheet"><h2>다르게 움직이는 관찰 종목</h2><div class="news">${picks}</div></div>` : ""}
      <p class="small muted">지금 구성과 다르게 움직였던 자산 가운데 최근 소식을 확인한 관찰 목록입니다. 매수·매도 추천이 아니며, Claude는 투자 자문 자격이 없습니다. 수치는 출처 기사 기준이니 원문에서 확인하세요.</p>`;
  }

  // ── 매매 일지 탭 ──────────────────────────────────────
  const cleanId = (v) => String(v).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 150);
  const tradeKey = (t) => cleanId(`${t.date}_${t.id}_${t.buy ? "buy" : "sell"}`);
  const dv = (k) => esc(S.draft[k] || "");
  const sideTag = (j) => `<span class="tag ${j.side === "sell" ? "sell" : "buy"}">${esc(j.kind || (j.side === "sell" ? "매도" : "매수"))}</span>`;

  function renderJournal() {
    const el = $("panel-journal");
    const active = document.activeElement, focusId = active && el.contains(active) ? active.id : null;
    let caret = null;
    try { caret = focusId && typeof active.selectionStart === "number" ? active.selectionStart : null; } catch (e) {}
    if (!S.db) {
      el.innerHTML = `<div class="sheet"><h2>이 화면에서는 일지를 쓸 수 없습니다</h2><p class="prose">저장소에 연결되지 않았습니다. Claude에 로그인한 상태로 다시 열어 주세요.</p></div>`;
      return;
    }
    const today = kstDate(Date.now());
    const docs = new Map(S.journal.map((j) => [j.key, j]));
    const since = kstDate(Date.now() - 30 * 86400000);
    const rows = [];
    // 키움 거래내역에 아직 안 잡혀 잔고로 임시 등록했던 매매(f_kwp:)에 남긴 이유는, 실제 체결이 잡히면 그 행으로 옮겨 보여 준다
    const pendingDoc = (t) => [...docs.values()].find((d) => String(d.key).startsWith("f_kwp:") && d.holding_id === t.id && d.side === (t.buy ? "buy" : "sell")
      && Math.abs(Date.parse(d.date) - Date.parse(t.date)) <= 86400000);
    for (const t of allTrades()) {                     // 자동 등록: 체결 내역과 수량 변화로 잡힌 매매
      let k = t.key, d = docs.get(k);
      if (!d && !String(k).startsWith("f_kwp:")) { const p = pendingDoc(t); if (p) { d = p; k = p.key; } }
      if (!d && t.date < since) continue;            // 이유를 안 남긴 오래된 매매는 올리지 않는다
      rows.push({ key: k, date: t.date, time: t.time, name: t.name, side: t.buy ? "buy" : "sell", kind: t.kind, pending: t.note === "체결 확인 중", dq: t.dq, value: t.value, usd: t.usd, price: t.price, realized: t.realized, exact: t.exact,
        reason: d ? d.reason || "" : "", auto: true, created_at: t.date + "T" + (t.time || "00:00") });
      docs.delete(k);
    }
    for (const d of docs.values()) rows.push({ ...d, auto: d.source === "detected" });
    rows.sort((a, b) => (a.date === b.date ? String(b.created_at || "").localeCompare(String(a.created_at || "")) : a.date < b.date ? 1 : -1));
    const missing = rows.filter((r) => !r.reason).length;
    const cur = current();
    const names = cur ? [...new Set((cur.p.holdings || []).map((h) => h.name))] : [];

    const rowHtml = (r) => {
      const k = esc(r.key);
      const meta = `<div class="jmeta"><span class="num muted">${esc(r.date)}${r.time ? " " + esc(r.time) : ""}</span><strong>${esc(r.name)}</strong>${sideTag(r)}${
        typeof r.dq === "number" ? `<span class="num muted">${sign(r.dq)}${qtyText(Math.abs(r.dq))}</span>` : ""}${
        r.usd && r.usd.value ? `<span class="num muted">${usd(r.usd.value)}</span>` : r.value ? `<span class="num muted">${r.exact ? "" : "약 "}${won(r.value)}</span>` : ""}${
        typeof r.realized === "number" ? `<span class="num ${dir(r.realized)}">실현 ${signWon(r.realized)}${r.exact ? "" : " 추정"}</span>` : ""}${
        r.pending ? `<span class="small muted">체결 확인 중</span>` : ""}</div>`;
      if (!r.reason) return `<div class="jrow">${meta}<div class="jedit">
        <input type="text" id="jp-${k}" data-draft="p:${k}" data-key="${k}" maxlength="300" placeholder="이 매매를 한 이유" aria-label="${esc(r.name)} 매매 이유" value="${dv("p:" + r.key)}">
        <button class="btn" type="button" data-jact="save-detected" data-key="${k}">저장</button></div></div>`;
      if (S.editing === r.key) return `<div class="jrow">${meta}<div class="jedit">
        <input type="text" id="je-${k}" data-draft="e:${k}" data-key="${k}" maxlength="300" aria-label="이유 수정" value="${dv("e:" + r.key)}">
        <button class="btn" type="button" data-jact="save-edit" data-key="${k}">저장</button><button class="chip" type="button" data-jact="cancel-edit">취소</button></div></div>`;
      const del = r.auto ? "" : S.confirmDel === r.key
        ? `<button class="chip" type="button" data-jact="del-yes" data-key="${k}">삭제 확인</button><button class="chip" type="button" data-jact="del-no">취소</button>`
        : `<button class="chip" type="button" data-jact="del" data-key="${k}">삭제</button>`;
      return `<div class="jrow">${meta}<p class="jreason">${esc(r.reason)}</p><div class="jbtns"><button class="chip" type="button" data-jact="edit" data-key="${k}">수정</button>${del}</div></div>`;
    };

    const list = rows.length ? rows.map(rowHtml).join("")
      : `<p class="muted">매매하면 여기에 자동으로 올라옵니다. 이유만 한 줄 적으면 됩니다.</p>`;
    const form = `<details id="j-manual"${S.formOpen ? " open" : ""}><summary>감지되지 않은 매매 직접 추가</summary>
      <div style="display:flex;flex-direction:column;gap:14px;padding-top:14px">
      <div class="jform">
        <label class="field"><span>날짜</span><input type="date" id="j-date" data-draft="date" value="${dv("date") || today}" max="${today}"></label>
        <label class="field grow"><span>종목</span><input type="text" id="j-name" data-draft="name" list="j-names" maxlength="40" placeholder="비트코인" value="${dv("name")}" autocomplete="off">
          <datalist id="j-names">${names.map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist></label>
        <div class="field"><span>구분</span><div class="chips">
          <button class="chip" type="button" id="j-side-buy" data-jact="side" data-side="buy" aria-pressed="${S.jSide === "buy"}">매수</button>
          <button class="chip" type="button" id="j-side-sell" data-jact="side" data-side="sell" aria-pressed="${S.jSide === "sell"}">매도</button></div></div>
      </div>
      <label class="field"><span>이유</span><textarea id="j-reason" data-draft="reason" rows="2" maxlength="300" placeholder="실적 발표 전 조정이라 보고 분할 매수">${dv("reason")}</textarea></label>
      <div class="jactions"><button class="btn" type="button" id="j-add" data-jact="add">기록 저장</button><span class="small muted" role="status">${esc(S.jMsg)}</span></div>
      </div></details>`;

    el.innerHTML = `<div class="sheet">
        <div class="jmeta"><h2>매매 기록</h2>${missing ? `<span class="tag">이유 미입력 ${missing}건</span>` : ""}</div>
        <div>${list}</div>
        <p class="small muted">최근 30일의 매매가 자동으로 올라옵니다. 업비트와 키움의 실제 체결 내역을 씁니다. 체결되면 보통 10~20초 안에 올라옵니다. 키움은 거래내역이 결제 뒤에 잡혀서, 그 전에는 잔고의 오늘 체결 수량으로 먼저 올리고 금액은 현재가로 추정합니다.</p>
      </div>
      <div class="sheet">${form}</div>`;
    if (focusId) {
      const n = $(focusId);
      if (n) { n.focus(); if (caret !== null) { try { n.setSelectionRange(caret, caret); } catch (e) {} } }
    }
  }

  async function journalWrite(key, doc) {
    S.jSaving = true;
    try { await S.db.doc("journal/" + key).set(doc); return true; }
    catch (e) { S.jMsg = "저장하지 못했습니다. 잠시 뒤 다시 시도하세요."; return false; }
    finally { S.jSaving = false; }
  }
  async function journalAction(act, key) {
    if (S.jSaving || !S.db) return;
    const now = new Date().toISOString();
    const entry = S.journal.find((j) => j.key === key);
    let focusAfter = null;
    if (act === "side") S.jSide = key;
    else if (act === "add") {
      const date = S.draft.date || kstDate(Date.now()), name = (S.draft.name || "").trim(), reason = (S.draft.reason || "").trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { S.jMsg = "날짜를 확인하세요."; focusAfter = "j-date"; }
      else if (!name) { S.jMsg = "종목을 입력하세요."; focusAfter = "j-name"; }
      else if (!reason) { S.jMsg = "이유를 입력하세요."; focusAfter = "j-reason"; }
      else {
        const cur = current(), h = cur ? (cur.p.holdings || []).find((x) => x.name === name) : null;
        const k = cleanId(`${date}_m${Date.now().toString(36)}`);
        if (await journalWrite(k, { key: k, date, name, holding_id: h ? h.id : null, side: S.jSide, kind: null, reason, source: "manual", created_at: now })) {
          S.draft.name = ""; S.draft.reason = ""; S.jMsg = "저장했습니다.";
        }
      }
    } else if (act === "save-detected") {
      const t = allTrades().find((x) => x.key === key), reason = (S.draft["p:" + key] || "").trim();
      if (!t) return;
      if (!reason) focusAfter = "jp-" + key;
      else if (await journalWrite(key, { key, date: t.date, name: t.name, holding_id: t.id, side: t.buy ? "buy" : "sell", kind: t.kind, dq: t.dq, value: Math.round(t.value), time: t.time || "", price: t.price, realized: typeof t.realized === "number" ? Math.round(t.realized) : null, exact: !!t.exact, reason, source: "detected", created_at: now })) delete S.draft["p:" + key];
    } else if (act === "edit" && entry) { S.editing = key; S.confirmDel = null; S.draft["e:" + key] = entry.reason || ""; focusAfter = "je-" + key; }
    else if (act === "cancel-edit") S.editing = null;
    else if (act === "save-edit" && entry) {
      const reason = (S.draft["e:" + key] || "").trim();
      if (!reason) focusAfter = "je-" + key;
      else if (await journalWrite(key, { ...entry, reason, updated_at: now })) S.editing = null;
    } else if (act === "del") { S.confirmDel = key; S.editing = null; }
    else if (act === "del-no") S.confirmDel = null;
    else if (act === "del-yes") {
      S.jSaving = true;
      try { await S.db.doc("journal/" + key).delete(); } catch (e) { S.jMsg = "삭제하지 못했습니다. 잠시 뒤 다시 시도하세요."; }
      S.jSaving = false; S.confirmDel = null;
    }
    if (S.tab === "journal") { renderJournal(); if (focusAfter && $(focusAfter)) $(focusAfter).focus(); }
  }
  document.addEventListener("input", (e) => {
    const k = e.target.dataset && e.target.dataset.draft; if (k) { S.draft[k] = e.target.value; if (S.jMsg) S.jMsg = ""; }
    const a = e.target.dataset && e.target.dataset.alert;
    if (a) { S.alertDraft[a] = e.target.value; S.alertMsg = ""; if (e.target.tagName === "SELECT") renderHoldings(); }   // 종목·기준을 바꾸면 단위와 현재가 안내를 다시 그린다
  });
  document.addEventListener("toggle", (e) => {
    if (e.target.id === "j-manual") S.formOpen = e.target.open;
    else if (e.target.id === "h-groups") S.hOpen.groups = e.target.open;
    else if (e.target.id === "h-trades") S.hOpen.trades = e.target.open;
    else if (e.target.id === "h-flows") S.hOpen.flows = e.target.open;
    else if (e.target.id === "h-deposit") S.hOpen.deposit = e.target.open;
    else if (e.target.id === "h-years") S.hOpen.years = e.target.open;
    else if (e.target.id === "h-income") S.hOpen.income = e.target.open;
    else if (e.target.id === "h-incdates") S.hOpen.incDates = e.target.open;
    else if (e.target.id === "h-alertset") S.hOpen.alertSet = e.target.open;
  }, true);
  document.addEventListener("change", (e) => {
    if (e.target.id === "h-year-select") { S.hYear = e.target.value; renderHistory(); }
    else if (e.target.id === "brief-date-select") { S.briefDate = e.target.value; if (S.briefBodies[S.briefDate] === "error") delete S.briefBodies[S.briefDate]; renderBriefing(); }
    else if (e.target.id === "lab-date-select") { S.labDate = e.target.value; renderLab(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.isComposing || !e.target.id) return;
    if (e.target.id.startsWith("jp-")) journalAction("save-detected", e.target.dataset.key);
    else if (e.target.id.startsWith("je-")) journalAction("save-edit", e.target.dataset.key);
  });

  // ── 공통 UI ───────────────────────────────────────────
  const tip = $("tip");
  function showTip(text, cx, cy) {
    tip.textContent = text; tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, cx + 12)) + "px";
    tip.style.top = Math.max(8, cy - h - 10) + "px";
  }
  function hideTip() { tip.hidden = true; }
  document.addEventListener("pointermove", (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (t) showTip(t.dataset.tip, e.clientX, e.clientY); else if (!(e.target.id === "vcHit" || e.target.id === "bxHit")) hideTip();
  });

  const TABS = ["holdings", "briefing", "profile", "history", "journal", "lab"];
  function render(liveOnly) {
    renderStatus();
    const ae = document.activeElement;   // 목표 알림의 선택 목록을 펼친 채 시세가 갱신되면 목록이 닫히므로 그때는 건너뛴다
    if (S.tab === "holdings" && liveOnly && ae && ae.tagName === "SELECT" && $("panel-holdings").contains(ae)) return;
    if (S.tab === "holdings") renderHoldings();
    else if (liveOnly && S.tab !== "history") return;   // 시세 갱신은 Holdings 와 History 만 다시 그린다 (입력 중인 글 보호)
    else if (S.tab === "briefing") renderBriefing();
    else if (S.tab === "profile") renderProfile();
    else if (S.tab === "history") renderHistory();
    else if (S.tab === "lab") renderLab();
    else renderJournal();
  }
  function tabFade() {
    const nav = document.querySelector("nav.tabs"); if (!nav) return;
    nav.classList.toggle("fade-l", nav.scrollLeft > 2);
    nav.classList.toggle("fade-r", nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 2);
  }
  document.querySelector("nav.tabs").addEventListener("scroll", tabFade, { passive: true });
  window.addEventListener("resize", tabFade);
  function setTab(tab) {
    if (!TABS.includes(tab)) tab = "holdings";
    S.tab = tab;
    for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    const nav = document.querySelector("nav.tabs"), selTab = document.querySelector(`.tab[data-tab="${tab}"]`);
    if (nav && selTab && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = selTab.offsetLeft - (nav.clientWidth - selTab.offsetWidth) / 2;
    tabFade();
    for (const t of TABS) { $("panel-" + t).hidden = t !== tab; if (t !== tab) $("panel-" + t).innerHTML = ""; }   // 숨긴 탭은 비워 둔다 (차트 id 가 겹치지 않게)
    try { history.replaceState(null, "", "#" + tab); } catch (e) {}
    hideTip(); render();
  }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.jact) journalAction(t.dataset.jact, t.dataset.jact === "side" ? t.dataset.side : t.dataset.key);
    else if (t.dataset.tab) setTab(t.dataset.tab);
    else if (t.dataset.lab) { S.labDate = t.dataset.lab; renderLab(); }
    else if (t.dataset.brief) { S.briefDate = t.dataset.brief; if (S.briefBodies[S.briefDate] === "error") delete S.briefBodies[S.briefDate]; renderBriefing(); }
    else if (t.dataset.range) { S.range = t.dataset.range; renderProfile(); }
    else if (t.dataset.metric) { S.metric = t.dataset.metric; renderProfile(); }
    else if (t.dataset.hyear) { S.hYear = t.dataset.hyear; renderHistory(); }
    else if (t.dataset.hacct) { S.hAcct = t.dataset.hacct; renderHistory(); }
    else if (t.dataset.ccy) { S.ccy = t.dataset.ccy; render(); }
    else if (t.dataset.hview) { S.hView = t.dataset.hview; renderHoldings(); }
    else if (t.dataset.alertAct) alertAction(t.dataset.alertAct, t.dataset.tid);
    else if (t.dataset.alertHide) { try { localStorage.setItem(hiddenKey(), t.dataset.alertHide); } catch (err) {} renderHoldings(); }
    else if (t.id === "refreshBtn") { S.pollStopped = false; poll(true); }
  });

  // ── 실시간 시세 (Mac의 로컬 서버) ───────────────────────
  let timer = null, inflight = false, delay = POLL_MS, fillsChanged = false;
  const STOP_CODES = new Set(["server_not_connected", "not_in_manifest", "not_granted", "consent_required", "capability_disabled",
    "capability_removed", "cancelled", "blocked_by_policy", "approval_required", "needs_reauth", "user_changed", "bad_request"]);
  function schedule() {
    clearTimeout(timer);
    if (!S.mcp || S.pollStopped) return;
    timer = setTimeout(() => poll(false), delay);
  }
  // 10초 갱신은 잔고·시세만 받는다(약 12KB). 체결·원장·배당·위험 지표가 든 전체 응답(약 800KB)은
  // 처음 열 때, Refresh 를 누를 때, 5분마다, 그리고 수량이나 오늘 체결 수량이 바뀌었을 때(매매)만 받는다.
  let fullP = null, fullAt = 0, holdSig = null, quotesOff = false;
  const sigOf = (p) => (p.holdings || []).map((h) => `${h.id}:${h.qty}:${h.today_buy || 0}:${h.today_sell || 0}`).sort().join("|");
  const valid = (p) => p && typeof p === "object" && Array.isArray(p.holdings);
  async function fetchView(full) {
    if (full || quotesOff) {
      const r = await S.mcp.callTool(SERVER, TOOL, {}, { cache: false });
      return r && r.payload;
    }
    try {
      const r = await S.mcp.callTool(SERVER, TOOL, { view: "quotes" }, { cache: false });
      return r && r.payload;
    } catch (e) {   // 서버가 아직 view 를 모르면(앱 재시작 전) 전체 조회로 돌아간다
      const r = await S.mcp.callTool(SERVER, TOOL, {}, { cache: false });
      quotesOff = true;
      return r && r.payload;
    }
  }
  async function poll(manual) {
    if (!S.mcp || inflight) return;
    if (document.hidden && !manual) { schedule(); return; }
    inflight = true;
    try {
      let p = await fetchView(manual || !fullP || Date.now() - fullAt > FULL_EVERY_MS);
      if (!valid(p)) throw { code: "tool_error", message: "응답 형식이 올바르지 않습니다" };
      if (p.view === "quotes" && holdSig !== null && sigOf(p) !== holdSig) p = await fetchView(true);   // 매매가 생겼다
      if (!valid(p)) throw { code: "tool_error", message: "응답 형식이 올바르지 않습니다" };
      const isFull = p.view !== "quotes";
      holdSig = sigOf(p);
      if (isFull) { fullP = p; fullAt = Date.now(); }
      else p = fullP ? { ...fullP, ...p } : p;   // 시세만 새것으로 바꾸고 나머지는 마지막 전체 응답을 쓴다
      const fsig = (Array.isArray(p.fills) ? p.fills.length + ":" + (p.fills[0] ? p.fills[0].id : "") : "") + "|" + (p.kiwoom ? ["realized", "buys", "income"].map((k) => { const l = p.kiwoom[k] || []; return l.length + ":" + (l[0] ? l[0].id : ""); }).join(":") : "") + "|" + (Array.isArray(p.div_upcoming) ? p.div_upcoming.length : "-");
      if (fsig !== S.fillsSig) { S.fillsSig = fsig; fillsChanged = true; }
      S.live = p; S.liveErr = null; delay = POLL_MS;
      if (!diagOk) { diagOk = true; reportDiag(null); }
      saveSnapshot();
      if (isFull) { saveLedger(); saveKiwoomLedger(); saveBench(); saveRisk(); saveDivCal(); }
      syncAlertsToServer(p);
    } catch (e) {
      const code = (e && e.code) || "upstream_error";
      S.liveErr = { code, message: (e && e.message) || "" };
      reportDiag(e || {});
      if (STOP_CODES.has(code)) S.pollStopped = true;
      else delay = Math.max(30000, (e && e.retryAfterMs) || 0);
    } finally {
      inflight = false; S.booted = true; render(!fillsChanged); fillsChanged = false; schedule();
    }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.mcp && !S.pollStopped) poll(false); });

  // ── 연결 진단: 실시간 연결이 실패한 이유를 저장소에 남긴다 (페이지 로드당 3번까지) ──
  let diagSent = 0, diagOk = false;
  const diagId = /Electron/.test(navigator.userAgent) ? "app" : "browser";   // 화면 종류별로 한 문서만 유지
  async function reportDiag(err) {
    if (!S.db || diagSent >= 3) return;
    diagSent++;
    const text = (v) => String(v || "").slice(0, 400);
    const d = { at: new Date().toISOString(), ok: !err, ua: navigator.userAgent, host: location.hostname, framed: window.top !== window, mcp: !!S.mcp,
      ancestors: Array.from(location.ancestorOrigins || []), referrer: document.referrer || null, width: window.innerWidth,
      error: err ? { code: err.code || null, message: text(err.message), server: err.server || null, retryable: !!err.retryable } : null };
    if (S.mcp) {
      try {
        const lt = await S.mcp.listTools();
        d.servers = (lt.servers || []).map((x) => ({ server: x.server, kind: x.kind || null, auth: x.authStatus, tools: (x.tools || []).map((t) => t.name) }));
      } catch (e) { d.listToolsError = { code: (e && e.code) || null, message: text(e && e.message) }; }
    }
    try {
      const perms = await window.claude.use("permissions");
      d.perms = perms ? await perms.state() : null;
      d.permHost = perms ? await perms.state("mcp:" + SERVER) : null;
    } catch (e) { d.permsError = text(e && e.message); }
    try { await S.db.doc("diag/" + diagId).set(d); } catch (e) {}
  }

  // ── 스냅샷 저장 (하루 한 문서, 10분에 한 번까지) ─────────
  let saving = false, lastSave = 0;
  async function saveSnapshot() {
    const p = S.live;
    if (!S.db || !S.canSave || !S.snapsLoaded || saving || !p || !isComplete(p)) return;
    const date = kstDate(p.ts), existing = S.snaps.find((s) => s.date === date);
    if (Date.now() - Math.max(lastSave, existing ? existing.ts || 0 : 0) < SNAPSHOT_EVERY_MS) return;
    const c = compute(p);
    if (!(c.total > 0)) return;
    const round = (v) => Math.round(v);
    const doc = {
      date, ts: p.ts, complete: true, writer: "page", fx: c.fx, fx_prev: c.fx0 && c.fx0 !== c.fx ? c.fx0 : null,
      sources: Object.keys(p.sources || {}).filter((k) => p.sources[k].configured && p.sources[k].ok), total: round(c.total), day_pnl: round(c.day), pnl: round(c.pnl),
      by_class: { kr: round(c.byClass.kr), us: round(c.byClass.us), crypto: round(c.byClass.crypto), cash: round(c.byClass.cash) },
      holdings: [...c.rows, ...c.hidden].map((h) => ({ id: h.id, cls: h.cls, symbol: h.symbol, name: h.name, qty: h.qty,
        avg: h.avg ?? null, avg_krw: h.avg_krw ?? null, pnl_krw: typeof h.pnl_krw === "number" ? Math.round(h.pnl_krw) : null, price: h.price ?? null, prev_close: h.prev_close ?? null, ccy: h.ccy, value: h.value === null ? 0 : round(h.value) })),
      cash: (p.cash || []).map((x) => ({ id: x.id, label: x.label, ccy: x.ccy, amount: x.amount })),
    };
    saving = true; lastSave = Date.now();
    try { await S.db.doc("snapshots/" + date).set(doc); }
    catch (e) { if (e && e.code !== "unavailable") S.canSave = false; }
    finally { saving = false; }
  }

  let ledgerSaving = false;
  async function saveLedger() {
    const p = S.live;
    if (!S.db || !S.canSave || ledgerSaving || !S.ledgerLoaded || !p || !Array.isArray(p.fills)) return;
    const items = p.fills.slice(0, 600);
    const fs = p.flows_summary || null;
    const sig = items.length + ":" + (items[0] ? items[0].id : "") + ":" + Math.round(p.realized_total || 0) + ":" + (fs ? fs.count + ":" + Math.round(fs.net) : "");
    if (S.ledger && S.ledger.sig === sig) return;
    ledgerSaving = true;
    try { await S.db.doc("ledger/upbit").set({ sig, updated_at: new Date().toISOString(), items, flows: fs ? (p.flows || []).slice(0, 400) : [], flows_summary: fs }); }
    catch (e) { if (e && e.code !== "unavailable") S.canSave = false; }
    finally { ledgerSaving = false; }
  }

  let divSaving = false;
  async function saveDivCal() {                      // 배당 예정을 보관해 브라우저·폰에서도 보이게 한다
    const d = S.live && S.live.div_upcoming;
    if (!S.db || !S.canSave || divSaving || !Array.isArray(d)) return;
    const sig = kstDate(Date.now()) + ":" + d.map((x) => x.id + "@" + x.ex).join(",");
    if (S.divDoc && S.divDoc.sig === sig) return;
    divSaving = true;
    try { await S.db.doc("calendar/dividends").set({ sig, updated_at: new Date().toISOString(), items: d }); S.divDoc = { sig, items: d }; }
    catch (e) {}
    finally { divSaving = false; }
  }

  let benchSaving = false;
  async function saveBench() {                       // 지수 시세를 저장소에 보관해 브라우저·폰에서도 비교가 보이게 한다
    const b = S.live && S.live.bench;
    if (!S.db || !S.canSave || benchSaving || !b || !Object.keys(b).length) return;
    const sig = Object.keys(b).sort().map((k) => k + ":" + (b[k].dates || []).slice(-1)[0]).join("|");
    if (S.benchDoc && S.benchDoc.sig === sig) return;
    benchSaving = true;
    try { await S.db.doc("bench/latest").set({ sig, updated_at: new Date().toISOString(), data: b }); S.benchDoc = { sig, data: b }; }
    catch (e) {}
    finally { benchSaving = false; }
  }

  let riskSaving = false;
  async function saveRisk() {                        // 위험 지표를 보관해 브라우저·폰에서도 보이게 한다 (값이 바뀔 때만)
    const r = S.live && S.live.risk;
    if (!S.db || !S.canSave || riskSaving || !r) return;
    const sig = r.end + ":" + r.mine.vol.toFixed(4) + ":" + Math.round(r.total_krw / 1e5);
    if (S.riskDoc && S.riskDoc.sig === sig) return;
    riskSaving = true;
    try { await S.db.doc("risk/latest").set({ sig, updated_at: new Date().toISOString(), data: r }); S.riskDoc = { sig, data: r }; }
    catch (e) {}
    finally { riskSaving = false; }
  }

  let kLedgerSaving = false;
  async function saveKiwoomLedger() {
    const k = S.live && S.live.kiwoom;
    if (!S.db || !S.canSave || kLedgerSaving || !S.kLedgerLoaded || !k) return;
    const items = (k.realized || []).slice(0, 800), buys = (k.buys || []).slice(0, 1000), fs = k.flows_summary || null, income = (k.income || []).slice(0, 600);
    const sig = items.length + ":" + (items[0] ? items[0].id : "") + ":" + Math.round(items.reduce((a, x) => a + (x.realized || 0), 0)) + ":" + (fs ? fs.count + ":" + Math.round(fs.net) : "") + ":u" + items.filter((x) => typeof x.realized_usd === "number").length + ":b" + buys.length + ":" + (buys[0] ? buys[0].id : "") + ":bk" + buys.filter((x) => x.funds).length + ":i" + income.length + ":" + (income[0] ? income[0].id : "");
    if (S.kLedger && S.kLedger.sig === sig) return;
    kLedgerSaving = true;
    try { await S.db.doc("ledger/kiwoom").set({ sig, updated_at: new Date().toISOString(), items, buys, flows: k.flows || [], flows_summary: fs, income }); }
    catch (e) { if (e && e.code !== "unavailable") S.canSave = false; }
    finally { kLedgerSaving = false; }
  }

  // ── 데모: Claude 앱 밖(GitHub Pages, 로컬 http 서버)에서는 demo/sample-portfolio.json 을 서버 응답처럼 쓴다 ──
  async function demoMcp() {
    let sample = null;
    try { const r = await fetch("demo/sample-portfolio.json", { cache: "no-store" }); if (r.ok) sample = await r.json(); } catch (e) {}
    if (!sample) return null;
    sample.ts = Date.now();
    document.title = "Axis (demo)";
    return {
      callTool: async (server, tool, args) => tool === TOOL ? { payload: sample } : { payload: { ok: true, alert_settings: sample.alert_settings } },
      listTools: async () => ({ servers: [] }),
    };
  }

  // ── 시작 ──────────────────────────────────────────────
  async function boot() {
    const use = (name) => (window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
    let [db, mcp] = await Promise.all([use("db"), use("mcp")]);
    if (!mcp) mcp = await demoMcp();
    S.db = db; S.mcp = mcp;
    if (db) {
      const sub = (name, key, limit, after) => db.collection(name).orderBy("date", "desc").limit(limit).onSnapshot((snap) => {
        S[key] = snap.docs.map((d) => d.data()).filter((d) => d && d.date);
        if (after) after();
        render();
      }, () => { if (after) after(); render(); });
      sub("snapshots", "snaps", 400, () => { S.snaps.sort((a, b) => (a.date < b.date ? -1 : 1)); S.snapsLoaded = true; });
      sub("briefing_index", "briefIndex", 30);
      db.collection("briefings").orderBy("date", "desc").limit(1).onSnapshot((snap) => {
        const d = snap.docs.length ? snap.docs[0].data() : null;
        S.briefLatest = d && d.date ? d : null; S.briefLoaded = true;
        if (S.tab === "briefing") renderBriefing();
      }, () => { S.briefLoaded = true; if (S.tab === "briefing") renderBriefing(); });
      sub("reviews", "reviews", 12);
      sub("lab", "lab", 12);
      sub("journal", "journal", 500);
      db.doc("settings/alerts").onSnapshot((snap) => { S.alerts = snap.exists ? snap.data() : null; S.alertsLoaded = true; if (S.tab === "holdings") renderHoldings(); }, () => { S.alertsLoaded = true; });
      db.doc("calendar/dividends").onSnapshot((snap) => { S.divDoc = snap.exists ? snap.data() : null; if (S.tab === "history") renderHistory(); }, () => {});
      db.doc("bench/latest").onSnapshot((snap) => { S.benchDoc = snap.exists ? snap.data() : null; if (S.tab === "profile") renderProfile(); }, () => {});
      db.doc("risk/latest").onSnapshot((snap) => { S.riskDoc = snap.exists ? snap.data() : null; if (S.tab === "lab") renderLab(); }, () => {});
      db.doc("ledger/kiwoom").onSnapshot((snap) => { S.kLedger = snap.exists ? snap.data() : null; S.kLedgerLoaded = true; render(); }, () => { S.kLedgerLoaded = true; });
      db.doc("ledger/upbit").onSnapshot((snap) => { S.ledger = snap.exists ? snap.data() : null; S.ledgerLoaded = true; render(); }, () => { S.ledgerLoaded = true; });
    } else S.briefLoaded = true;
    if (mcp) poll(true);
    else { S.booted = true; S.liveErr = { code: "server_not_connected", message: "" }; render(); reportDiag({ code: "mcp_unavailable" }); }
  }

  setTab((location.hash || "").slice(1) || "holdings");
  window.addEventListener("hashchange", () => { const t = (location.hash || "").slice(1); if (t && t !== S.tab) setTab(t); });
  boot();
})();
</script>
