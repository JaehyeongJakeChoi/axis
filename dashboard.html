<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 열. 검은 히어로 카드에 총액, 그 아래 흰 카드들. 라임은 상태 표시와 선택 상태에만 쓴다. */
:root {
  --bg: #f4f3ef; --surface: #ffffff; --ink: #0c0c0b; --ink-2: #55544f; --muted: #8a8983;
  --line: #e7e5df; --line-strong: #d3d1ca; --wash: #efeee9;
  --accent: #e4f222; --accent-ink: #0c0c0b; --solid: #0c0c0b; --solid-ink: #ffffff;
  --up: #d0322e; --down: #1f5fc4;               /* 국내 관례: 상승 빨강, 하락 파랑 */
  --hero-bg: #0c0c0b; --hero-ink: #ffffff; --hero-muted: #a3a29b; --hero-line: #2a2a27; --hero-up: #ff7d70; --hero-down: #86b4ff;
  --chart-line: #0c0c0b; --chart-fill: rgba(228, 242, 34, 0.42);
  --s-kr: #2a78d6; --s-us: #eb6834; --s-crypto: #1baf7a; --s-cash: #b3b1aa;
  --warn-bg: #fbf1d9; --warn-ink: #6b4a00;
  --sig-green: #1baf7a; --sig-yellow: #e0a400; --sig-red: #d0322e; --sig-off: #c9c7c0;   /* 위험 신호 세 가지 */
  --sans: "Geist", "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a09; --surface: #141413; --ink: #f5f4ef; --ink-2: #bdbbb3; --muted: #8a8983;
    --line: #262624; --line-strong: #3a3a36; --wash: #1e1e1c;
    --accent: #e4f222; --accent-ink: #0c0c0b; --solid: #e4f222; --solid-ink: #0c0c0b;
    --up: #ff7d70; --down: #86b4ff;
    --hero-bg: #1a1a18; --hero-ink: #ffffff; --hero-muted: #a3a29b; --hero-line: #2e2e2b; --hero-up: #ff7d70; --hero-down: #86b4ff;
    --chart-line: #e4f222; --chart-fill: rgba(228, 242, 34, 0.12);
    --s-kr: #3987e5; --s-us: #d95926; --s-crypto: #199e70; --s-cash: #5f5e59;
    --warn-bg: #33290f; --warn-ink: #f2d48a; color-scheme: dark;
    --sig-green: #2cc28c; --sig-yellow: #f2c037; --sig-red: #ff6b5e; --sig-off: #4a4a46;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a09; --surface: #141413; --ink: #f5f4ef; --ink-2: #bdbbb3; --muted: #8a8983;
  --line: #262624; --line-strong: #3a3a36; --wash: #1e1e1c;
  --accent: #e4f222; --accent-ink: #0c0c0b; --solid: #e4f222; --solid-ink: #0c0c0b;
  --up: #ff7d70; --down: #86b4ff;
  --hero-bg: #1a1a18; --hero-ink: #ffffff; --hero-muted: #a3a29b; --hero-line: #2e2e2b; --hero-up: #ff7d70; --hero-down: #86b4ff;
  --chart-line: #e4f222; --chart-fill: rgba(228, 242, 34, 0.12);
  --s-kr: #3987e5; --s-us: #d95926; --s-crypto: #199e70; --s-cash: #5f5e59;
  --warn-bg: #33290f; --warn-ink: #f2d48a; color-scheme: dark;
  --sig-green: #2cc28c; --sig-yellow: #f2c037; --sig-red: #ff6b5e; --sig-off: #4a4a46;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p { margin: 0; }
h1 { font-weight: 700; font-size: 21px; letter-spacing: -0.04em; display: flex; align-items: center; gap: 9px; }
.mark { width: 24px; height: 24px; flex: none; }
h2 { font-weight: 600; font-size: 16px; letter-spacing: -0.015em; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); }
a { color: var(--ink); text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.muted { color: var(--muted); } .small { font-size: 12px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 11px; color: var(--ink-2); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.warn { background: #d99a00; }
.pill:has(.dot.live) { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.dot.live { background: var(--accent-ink); }
.btn { border: 0; background: var(--solid); color: var(--solid-ink); border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600; }
.btn:hover { opacity: 0.86; }

nav.tabs { display: inline-flex; align-self: flex-start; overflow-x: auto; gap: 2px; background: var(--wash); border-radius: 999px; padding: 4px; max-width: 100%; }
.tab { border: 0; background: none; padding: 7px 16px; font-size: 13px; font-weight: 500; color: var(--ink-2); border-radius: 999px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--solid); color: var(--solid-ink); font-weight: 600; }
.panel { display: flex; flex-direction: column; gap: 16px; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hero { background: var(--hero-bg); color: var(--hero-ink); border: 1px solid var(--hero-line); border-radius: 20px; padding: 28px; min-width: 0; }
.hero .label, .hero .muted, .hero .flat { color: var(--hero-muted); }
.hero .up { color: var(--hero-up); } .hero .down { color: var(--hero-down); }
.figures { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 20px 28px; align-items: end; }
.fig { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fig .label { font-size: 12px; color: var(--muted); font-weight: 500; }
.fig .value { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.fig.hero-total .value { font-size: 46px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05; }
.fig .sub { font-size: 12px; }
/* 모바일: 탭 바는 옆으로 밀리고 가장자리를 흐리게 해서 더 있다는 걸 보여 준다 */
nav.tabs { scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs.fade-r { -webkit-mask-image: linear-gradient(90deg, #000 82%, transparent); mask-image: linear-gradient(90deg, #000 82%, transparent); }
nav.tabs.fade-l { -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%); mask-image: linear-gradient(90deg, transparent, #000 18%); }
nav.tabs.fade-l.fade-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
.figures .fig .value { white-space: nowrap; }
/* 알림 배너와 설정 */
.alerts { background: var(--hero-bg); color: var(--hero-ink); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.alerts .ah { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.alerts .ah strong { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.alerts .ah strong::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.alerts ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.alerts .up { color: var(--hero-up); } .alerts .down { color: var(--hero-down); }
.alerts .ghost { border: 1px solid var(--hero-line); background: none; color: var(--hero-muted); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.alerts .ghost:hover { color: var(--hero-ink); border-color: var(--hero-muted); }
.aset { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px; }
.aset .field input { max-width: 120px; }
.unit { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; font-weight: 400; }
/* 세금 진행 막대 */
.meter { height: 10px; border-radius: 5px; background: var(--wash); overflow: hidden; display: flex; }
.meter span { height: 100%; }
.taxgrid td:last-child { white-space: normal; min-width: 180px; text-align: left; color: var(--ink-2); }
/* 벤치마크 범례 */
.blegend { display: flex; flex-wrap: wrap; gap: 6px 20px; list-style: none; padding: 0; margin: 0; font-size: 13px; }
.blegend li { display: flex; align-items: center; gap: 7px; }
.blegend .ln { width: 16px; height: 3px; border-radius: 2px; }
@media (max-width: 760px) {
  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fig.hero-total { grid-column: 1 / -1; }
  .fig.hero-total .value { font-size: 34px; } .hero { padding: 22px; } .sheet { padding: 18px; }
}

.alloc { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; }
.alloc .seg { min-width: 3px; }
.alloc-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; list-style: none; padding: 0; margin: 0; font-size: 13px; }
.legend li { display: flex; align-items: baseline; gap: 6px; }
.sw { width: 9px; height: 9px; border-radius: 3px; flex: none; align-self: center; }

.scroll { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 740px; font-size: 13px; }
th, td { padding: 12px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; padding-left: 12px; }
th:last-child, td:last-child { padding-right: 12px; }
thead th { font-size: 12px; font-weight: 500; color: var(--muted); padding-block: 0 10px; }
tbody tr:last-child td { border-bottom: 0; }
tr.group td { background: var(--wash); background-clip: padding-box; border-top: 10px solid transparent; border-bottom: 0; padding-block: 8px; font-weight: 600; color: var(--ink); }
tr.group td:first-child { border-radius: 10px 0 0 10px; } tr.group td:last-child { border-radius: 0 10px 10px 0; }
tr.group td .sw { display: inline-block; margin-right: 8px; }
td .sym { color: var(--muted); font-size: 12px; margin-left: 6px; }
td .two { display: block; font-size: 12px; }

.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 12px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); list-style: none; padding: 0; margin: 0; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: var(--wash); padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
/* 날짜 선택기: ‹ 이전 · 날짜 목록 · 다음 › (브리핑·Lab) */
.dpick { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dpick .step { flex: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.dpick .step:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
.dpick .step:disabled { opacity: 0.4; cursor: default; }
.dpick .picker { min-width: 0; }
.dpick .picker select { min-width: 0; max-width: 100%; }
.chip { border: 1px solid var(--line-strong); background: none; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--solid); border-color: var(--solid); color: var(--solid-ink); font-weight: 600; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; }
.headline { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.25; text-wrap: balance; max-width: 30ch; }
.market { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px 14px; margin: 0; max-width: 76ch; }
.market dt { font-weight: 600; color: var(--ink-2); } .market dd { margin: 0; }
.news { display: flex; flex-direction: column; gap: 20px; }
.news-group { display: flex; flex-direction: column; gap: 10px; }
.news-item { display: flex; flex-direction: column; gap: 2px; max-width: 76ch; padding-left: 12px; border-left: 3px solid var(--accent); }
.news-item .t { font-weight: 600; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; max-width: 76ch; }
/* 브리핑 v2: 모닝 노트. 요약 → 시장 수치 → 매크로 주제 → 내 포트폴리오 → 종목 → 일정 */
.thesis { max-width: 72ch; display: flex; flex-direction: column; gap: 18px; font-size: 15px; line-height: 1.7; color: var(--ink); }
.thesis section { display: flex; flex-direction: column; gap: 4px; }
.thesis strong, .topic strong, .sowhat strong { font-weight: 650; }
.thesis h3 { font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }
.mkt td, .mkt th { padding-block: 7px; }
.mkt tr.group td { padding-block: 6px; border-top-width: 6px; }
table.mkt { min-width: 600px; }
.mkt td:first-child { font-weight: 500; }
.mkt .asof { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.mkt th.r52, .mkt td.r52 { text-align: left; width: 120px; }
.r52bar { position: relative; height: 6px; border-radius: 3px; background: var(--wash); width: 96px; }
.r52bar span { position: absolute; top: -3px; width: 4px; height: 12px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.r52bar.hi span { background: var(--up); } .r52bar.lo span { background: var(--down); }
.kv { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--ink-2); }
.kv strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.topics { display: flex; flex-direction: column; }
.topic { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 18px; padding-block: 16px; border-top: 1px solid var(--line); }
.topic:first-child { border-top: 0; padding-top: 0; } .topic:last-child { padding-bottom: 0; }
.topic h3 { font-size: 13px; color: var(--ink); }
.topic .body { display: flex; flex-direction: column; gap: 8px; max-width: 76ch; min-width: 0; }
.topic .what { font-weight: 600; }
.sowhat { background: var(--wash); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.sowhat .lb { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
.srcs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
.srcs a { color: var(--ink-2); }
.movers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 28px; }
.movers ul { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.movers li { display: flex; justify-content: space-between; gap: 10px; }
table.sens { min-width: 520px; }
table.cal { min-width: 640px; }
.cal td { white-space: normal; text-align: left; vertical-align: top; }
.cal th { text-align: left; }
.cal td:first-child { white-space: nowrap; color: var(--ink-2); }
.cal td:nth-child(2) { font-weight: 600; min-width: 160px; }
.news-item .mv { font-size: 12px; font-weight: 600; }
.news-item .imp { color: var(--ink-2); }
@media (max-width: 560px) { .topic { grid-template-columns: 1fr; } }
/* 브리핑 v3: 한 줄 → 오늘 볼 것 → 위험 신호 세 가지, 나머지는 '자세히' 안에 */
.oneline, .today, .sig .sd, .sig .sq { word-break: keep-all; }
.oneline { font-size: 24px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.3; text-wrap: balance; max-width: 32ch; overflow-wrap: anywhere; }
.today { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; max-width: 72ch; }
.today li { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 3px solid var(--accent); min-width: 0; }
.today .t { font-weight: 600; }
.today .me { color: var(--ink-2); }
.sigs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.sig { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.sig .light { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-top: 4px; background: var(--sig-off); }
.sig .light.green { background: var(--sig-green); } .sig .light.yellow { background: var(--sig-yellow); } .sig .light.red { background: var(--sig-red); }
.sig.red { border-color: var(--sig-red); } .sig.yellow { border-color: var(--sig-yellow); }
.sig .sb { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sig .sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.sig .sh strong { font-size: 13px; }
.sig .sv { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
.sig .sd { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.sig .sm { font-size: 12px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.sig .sq { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
details.more > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 22px; font-size: 15px; font-weight: 600; color: var(--ink); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "펼치기"; font-size: 12px; font-weight: 500; color: var(--muted); }
details.more[open] > summary::after { content: "접기"; }
details.more > .more-body { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; min-width: 0; }
@media (max-width: 560px) { .oneline { font-size: 21px; } .sigs { grid-template-columns: 1fr; } details.more > summary { padding: 14px 16px; } }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px 28px; }
.tiles .fig .value { font-size: 24px; letter-spacing: -0.03em; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--hero-bg); color: var(--hero-ink); border: 1px solid var(--hero-line); font-size: 12px; padding: 6px 9px; border-radius: 8px; max-width: 260px; white-space: pre-line; }
.trades td:first-child { color: var(--muted); }
.trades th:nth-child(-n+3), .trades td:nth-child(-n+3) { text-align: left; }
.tag { display: inline-block; background: var(--wash); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 500; }
.jform { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.field.grow { flex: 1 1 200px; }
.field input, .field textarea, .field select, .jedit input { font: inherit; font-size: 14px; font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 11px; min-width: 0; width: 100%; }
.field textarea { resize: vertical; min-height: 62px; }
.jactions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.jrow { display: flex; flex-direction: column; gap: 8px; padding-block: 14px; border-top: 1px solid var(--line); }
.jrow:first-child { border-top: 0; padding-top: 0; } .jrow:last-child { padding-bottom: 0; }
.jmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.jreason { max-width: 68ch; overflow-wrap: anywhere; white-space: pre-wrap; }
.jedit { display: flex; gap: 8px; align-items: center; } .jedit input { flex: 1; }
.jbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.better { color: var(--s-crypto); font-weight: 600; }
.tag.buy { color: var(--up); } .tag.sell { color: var(--down); }
details summary { cursor: pointer; font-size: 12px; color: var(--ink-2); }
#j-manual summary { font-size: 13px; font-weight: 600; color: var(--ink); }
.fold summary { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; color: var(--ink); }
.fold[open] summary { margin-bottom: 14px; }
.traits { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.trait { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.trait .t { font-weight: 600; }
.theme-row { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr); gap: 6px 16px; align-items: baseline; padding-block: 10px; border-top: 1px solid var(--line); }
.theme-row:first-child { border-top: 0; padding-top: 0; }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.pick { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pick .head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.pick .head strong { font-size: 15px; }
@media (max-width: 560px) { .theme-row { grid-template-columns: 1fr; } }
.picker { position: relative; display: inline-flex; align-items: center; }
.picker select { appearance: none; -webkit-appearance: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 36px 7px 14px; cursor: pointer; min-width: 132px; }
.picker select:hover { border-color: var(--ink); }
.picker select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.picker svg { position: absolute; right: 13px; width: 12px; height: 12px; pointer-events: none; color: var(--ink-2); }
.bar-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 14px; }
table.weights { min-width: 620px; }
.weights td { vertical-align: middle; }
.weights td:first-child { white-space: normal; min-width: 170px; }
.weights .name { font-weight: 600; }
.weights .meta { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.weights th.w, .weights td.w { text-align: left; width: 34%; min-width: 180px; }
.wcell { display: flex; align-items: center; gap: 12px; }
.wcell strong { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; min-width: 52px; text-align: right; }
.wtrack { flex: 1; height: 8px; border-radius: 4px; background: var(--wash); overflow: hidden; min-width: 60px; }
.wtrack span { display: block; height: 100%; border-radius: 4px; }
tr.group .wcell strong { font-size: 14px; }
/* 모바일 덮어쓰기: 위 규칙보다 뒤에 와야 한다 */
@media (max-width: 560px) {
  .tab { padding: 7px 12px; }
  .figures .fig:not(.hero-total) .value { font-size: 16px; }
  table.weights { min-width: 0; }
  .weights th, .weights td { padding-inline: 6px; }
  .weights th:nth-child(5), .weights td:nth-child(5) { display: none; }
  .weights.dayv th:nth-child(5), .weights.dayv td:nth-child(5) { display: table-cell; }
  .weights.dayv th:nth-child(4), .weights.dayv td:nth-child(4) { display: none; }
  .weights th.w, .weights td.w { width: auto; min-width: 0; }
  .weights td:first-child { min-width: 0; }
  .weights .wtrack { display: none; }
  .weights .wcell strong { min-width: 0; font-size: 14px; }
  .weights .meta { font-size: 11px; }
  .weights td.num { font-size: 12px; }
  .weights td:first-child { overflow-wrap: anywhere; }
  tr.group td .sw { margin-right: 6px; }
}
@media (prefers-reduced-motion: no-preference) { .dot.live { animation: pulse 2.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: 0.35; } }

    <div class="status">
      <span class="pill"><span class="dot" id="dot"></span><span id="statusText">Connecting</span></span>

  <section class="panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden></section>
  <section class="panel" id="panel-journal" role="tabpanel" aria-labelledby="tab-journal" hidden></section>

<script>
(() => {
  const SERVER = "host:portfolio", TOOL = "get_portfolio";
  const POLL_MS = 10000, FULL_EVERY_MS = 5 * 60 * 1000, SNAPSHOT_EVERY_MS = 10 * 60 * 1000, DUST_KRW = 1000;
  const CLASSES = [
    { key: "kr", label: "국내주식", color: "var(--s-kr)" },
    { key: "us", label: "미국주식", color: "var(--s-us)" },
    { key: "crypto", label: "코인", color: "var(--s-crypto)" },
    { key: "cash", label: "현금", color: "var(--s-cash)" },
  ];
  const FULL_FROM = "2026-10-05";   // 이 날부터 키움과 업비트가 모두 스냅샷에 들어간다. 추이는 이 날부터 그린다.
  const SOURCE_LABEL = { kiwoom_kr: "키움 국내주식", kiwoom_us: "키움 미국주식", upbit: "업비트" };

  const S = {
    db: null, mcp: null, booted: false,
    live: null, liveErr: null, pollStopped: false,
    snaps: [], snapsLoaded: false, briefIndex: [], briefLatest: null, briefLoaded: false, briefBodies: {}, reviews: [], lab: [], labDate: null,
    tab: "holdings", briefDate: null, range: "3m", metric: "pnl", canSave: true,
    hYear: "all", hAcct: "all", alerts: null, alertsLoaded: false, alertDraft: {}, alertMsg: "", benchDoc: null, riskDoc: null, divDoc: null, kLedger: null, kLedgerLoaded: false, hOpen: { groups: false, trades: false, flows: false, deposit: false, years: false, income: false, incDates: false, alertSet: false },
    ccy: "KRW", hView: "class",
    journal: [], ledger: null, ledgerLoaded: false, draft: {}, formOpen: false, jSide: "buy", jMsg: "", jSaving: false, editing: null, confirmDel: null,
  };
  const $ = (id) => document.getElementById(id);

  // ── 표기 ──────────────────────────────────────────────
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nf0 = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 0 });
  const won = (v) => nf0.format(Math.round(v)) + "원";
  const sign = (v) => (v > 0 ? "+" : v < 0 ? "−" : "");
  const signWon = (v) => sign(Math.round(v)) + nf0.format(Math.abs(Math.round(v))) + "원";
  const pct = (r) => sign(r) + Math.abs(r * 100).toFixed(2) + "%";
  const share = (r) => (r * 100).toFixed(1) + "%";
  const arrow = (v) => (v > 0 ? "▲ " : v < 0 ? "▼ " : "");
  const dir = (v) => (v > 0 ? "up" : v < 0 ? "down" : "flat");
  const px = (v, ccy) => ccy === "USD"
    ? "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : (v < 100 ? v.toLocaleString("ko-KR", { maximumFractionDigits: 4 }) : nf0.format(v)) + "원";
  const qtyText = (v) => v.toLocaleString("ko-KR", { maximumFractionDigits: v < 1 ? 8 : v < 1000 ? 4 : 0 });
  const usd = (v) => "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const signUsd = (v) => sign(Math.round(v * 100)) + usd(v);
  // 원화/달러 전환 칩. 달러는 미국주식에만 적용된다.
  const ccyChips = () => `<div class="chips" role="group" aria-label="통화">${[["KRW", "원화"], ["USD", "달러"]].map(([k, l]) =>
    `<button class="chip" type="button" data-ccy="${k}" aria-pressed="${S.ccy === k}">${l}</button>`).join("")}</div>`;
  const compactWon = (v) => { const a = Math.abs(v); return a >= 1e8 ? (v / 1e8).toFixed(2) + "억" : a >= 1e6 ? nf0.format(Math.round(v / 1e4)) + "만" : a >= 1e4 ? (v / 1e4).toFixed(1) + "만" : nf0.format(Math.round(v)) + "원"; };
  const kstDate = (ts) => new Date(ts + 9 * 3600 * 1000).toISOString().slice(0, 10);
  const clock = (ts) => new Date(ts).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  const dayTime = (ts) => new Date(ts).toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  const dateLabel = (d) => { const [y, m, dd] = String(d).split("-").map(Number); return y && m && dd ? `${m}월 ${dd}일` : String(d); };
  // 브리핑 본문 강조: **굵게** 만 허용한다 (먼저 이스케이프하므로 다른 태그는 들어갈 수 없다)
  const rich = (v) => esc(v).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? String(u) : null);

  // ── 계산 ──────────────────────────────────────────────
  function compute(p) {
    const fx = p.fx && p.fx.usdkrw ? p.fx.usdkrw : null;
    const fx0 = p.fx && p.fx.prev_usdkrw ? p.fx.prev_usdkrw : fx;   // 전일 환율 (없으면 환율 효과 0)
    const rate = (ccy) => (ccy === "USD" ? fx : 1);
    const rows = [], hidden = [];
    const byClass = { kr: 0, us: 0, crypto: 0, cash: 0 };
    let cost = 0, pnl = 0, day = 0, dayBase = 0, fxDay = 0;
    for (const h of p.holdings || []) {
      const r = rate(h.ccy);
      const value = h.price && r ? h.qty * h.price * r : null;
      const row = { ...h, value, pnl: null, pnlRate: null, day: null, dayRate: null };
      if (value === null || value < DUST_KRW) { hidden.push(row); if (value) byClass[h.cls] += value; continue; }
      const c0 = h.ccy === "USD" && h.avg_krw ? h.qty * h.avg_krw : h.avg ? h.qty * h.avg * r : 0;   // 매입 원가 (미국주식은 매입 당시 환율)
      if (typeof h.pnl_krw === "number" && c0) { row.pnl = h.pnl_krw; row.pnlRate = h.pnl_krw / c0; cost += c0; pnl += row.pnl; }   // 증권사가 계산한 평가손익
      else if (h.ccy === "USD" && h.avg_krw) { row.pnl = value - c0; row.pnlRate = value / c0 - 1; cost += c0; pnl += row.pnl; }
      else if (h.avg) { row.pnl = h.qty * (h.price - h.avg) * r; row.pnlRate = h.price / h.avg - 1; cost += h.qty * h.avg * r; pnl += row.pnl; }
      // 종목의 '오늘'은 주가 움직임(지금 환율로 환산)만 담고, 미국주식의 환율 움직임은 fxDay 로 따로 모은다
      if (h.prev_close) {
        row.day = h.qty * (h.price - h.prev_close) * r; row.dayRate = h.price / h.prev_close - 1; day += row.day;
        dayBase += h.qty * h.prev_close * (h.ccy === "USD" ? fx0 : 1);
        if (h.ccy === "USD") fxDay += h.qty * h.prev_close * (fx - fx0);
      }
      byClass[h.cls] = (byClass[h.cls] || 0) + value;
      rows.push(row);
    }
    for (const c of p.cash || []) { const r = rate(c.ccy); if (r) byClass.cash += c.amount * r; }
    const total = byClass.kr + byClass.us + byClass.crypto + byClass.cash;
    rows.sort((a, b) => b.value - a.value);
    const stockDay = day; day += fxDay;
    return { fx, fx0, rows, hidden, byClass, total, cost, pnl, pnlRate: cost ? pnl / cost : null, day, stockDay, fxDay, dayRate: dayBase ? day / dayBase : null };
  }

  const isComplete = (p) => {
    const src = Object.values(p.sources || {});
    const configured = src.filter((s) => s.configured);
    if (!configured.length || configured.some((s) => !s.ok || s.stale)) return false;
    return !(p.holdings || []).some((h) => h.ccy === "USD") || !!(p.fx && p.fx.usdkrw);
  };

  const signCompact = (v) => sign(Math.round(v)) + compactWon(Math.abs(v));
  const agoText = (ms) => { const m = Math.round(ms / 60000); return m < 60 ? `${m}분 전` : m < 48 * 60 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`; };
  // '오늘 손익'의 기준: 시장마다 지금 무엇을 비교하고 있는지 (공휴일은 따지지 않는다)
  function marketBasis(ts) {
    const at = (tz) => {
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" }).formatToParts(new Date(ts));
      const g = (t) => (parts.find((x) => x.type === t) || {}).value;
      return { off: g("weekday") === "Sat" || g("weekday") === "Sun", m: Number(g("hour")) * 60 + Number(g("minute")) };
    };
    const k = at("Asia/Seoul"), n = at("America/New_York");
    const kr = k.off || k.m < 540 ? "국내 마지막 거래일" : k.m < 930 ? "국내 장중" : "국내 마감";
    const us = n.off || n.m < 570 ? "미국 마지막 거래일" : n.m < 960 ? "미국 장중" : "미국 마감";
    return `${kr} · ${us} · 코인 09시 대비`;
  }

  function latestSnap() { return S.snaps.length ? S.snaps[S.snaps.length - 1] : null; }
  function current() {
    if (S.live) return { p: S.live, live: true };
    const s = latestSnap();
    return s ? { p: { ts: s.ts, fx: { usdkrw: s.fx, prev_usdkrw: s.fx_prev || null }, holdings: s.holdings || [], cash: s.cash || [], sources: null }, live: false } : null;
  }

  // ── 자산 배분 막대 ─────────────────────────────────────
  function allocBar(byClass, total) {
    const segs = CLASSES.filter((c) => byClass[c.key] > 0);
    const label = segs.map((c) => `${c.label} ${share(byClass[c.key] / total)}`).join(", ");
    return `<div class="alloc" role="img" aria-label="자산 배분: ${esc(label)}">` + segs.map((c) =>
      `<span class="seg" style="flex:${(byClass[c.key] / total).toFixed(5)} 1 0;background:${c.color}" data-tip="${esc(c.label)}\n${share(byClass[c.key] / total)} · ${won(byClass[c.key])}"></span>`).join("") + `</div>`;
  }
  function allocLegend(byClass, total) {
    return `<ul class="legend">` + CLASSES.filter((c) => byClass[c.key] > 0).map((c) =>
      `<li><span class="sw" style="background:${c.color}"></span>${c.label} <strong class="num">${share(byClass[c.key] / total)}</strong> <span class="muted num">${won(byClass[c.key])}</span></li>`).join("") + `</ul>`;
  }

  // ── 보유 자산 탭 ───────────────────────────────────────
  const SETUP = `
    <ol class="steps">
      <li><strong>API 키 발급.</strong> 업비트는 마이페이지의 Open API 관리에서 '자산조회'만 체크해 발급합니다. 키움은 openapi.kiwoom.com 에서 REST API 사용 신청 후 실전투자 앱키를 발급합니다. 두 곳 모두 이 Mac의 공인 IP를 허용 목록에 등록해야 합니다.</li>
      <li><strong>키 입력.</strong> Mac의 <code>~/portfolio-desk/api-keys.txt</code> 파일을 열어 네 줄을 채우고 저장합니다. 키는 이 Mac 밖으로 나가지 않습니다.</li>
      <li><strong>확인.</strong> Claude 데스크톱 앱에서 이 페이지를 열면 10초마다 갱신됩니다. 터미널에서 <code>python3 ~/portfolio-desk/server.py --check</code> 로 연결 상태만 따로 볼 수 있습니다.</li>
    </ol>`;

  function liveErrorText(e) {
    switch (e.code) {
      case "server_not_connected": return "이 화면에서는 Mac의 시세 서버에 닿지 않습니다. Mac의 Claude 데스크톱 앱에서 열면 실시간으로 갱신됩니다. 앱에서 열었는데도 이 문구가 보이면 앱을 다시 시작해 주세요.";
      case "not_in_manifest": case "not_granted": case "consent_required": return "이 페이지가 시세 서버를 쓰도록 허용되지 않았습니다. 페이지의 권한 메뉴에서 portfolio 를 허용한 뒤 다시 연결해 주세요.";
      case "capability_disabled": case "capability_removed": return "이 화면에서는 실시간 연결을 쓸 수 없습니다.";
      case "cancelled": return "시세 조회가 취소되었습니다.";
      case "blocked_by_policy": case "approval_required": return "조직 정책 때문에 시세 서버를 호출할 수 없습니다.";
      case "tool_error": return "시세 서버가 오류를 돌려주었습니다: " + (e.message || "");
      case "rate_limited": case "server_unavailable": return "시세 서버 응답이 늦습니다. 잠시 뒤 자동으로 다시 시도합니다.";
      default: return "실시간 연결에 문제가 있습니다. 잠시 뒤 자동으로 다시 시도합니다.";
    }
  }

  function renderStatus() {
    const cur = current(), dot = $("dot"), txt = $("statusText"), btn = $("refreshBtn");
    btn.hidden = !S.mcp;
    btn.textContent = S.pollStopped ? "Reconnect" : "Refresh";
    if (S.live && !S.liveErr) { dot.className = "dot live"; txt.textContent = `Live · ${clock(S.live.ts)}`; }
    else if (S.live) { dot.className = "dot warn"; txt.textContent = `Offline · as of ${clock(S.live.ts)}`; }
    else if (cur) { dot.className = "dot"; txt.textContent = `Snapshot · ${new Date(cur.p.ts).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false })}`; }
    else { dot.className = "dot"; txt.textContent = S.booted ? "No data" : "Connecting"; }
  }

  function renderHoldings() {
    const el = $("panel-holdings"), cur = current();
    const active = document.activeElement, focusId = active && el.contains(active) && active.id ? active.id : null;
    const errNote = S.liveErr ? `<div class="notice">${esc(liveErrorText(S.liveErr))}</div>` : "";
    if (!cur) {
      el.innerHTML = !S.booted
        ? `<div class="sheet"><p class="muted">보유 종목과 현재가를 불러오는 중입니다.</p></div>`
        : `${errNote}<div class="sheet"><h2>아직 표시할 자산이 없습니다</h2><p class="prose">업비트와 키움 계좌를 연결하면 여기에 총 평가금액, 자산 배분, 종목별 손익이 나타납니다.</p>${SETUP}</div>`;
      return;
    }
    const { p, live } = cur, c = compute(p);
    const src = p.sources || {};
    const names = Object.keys(SOURCE_LABEL);
    const noneConfigured = live && names.every((k) => src[k] && !src[k].configured);
    if (noneConfigured) {
      el.innerHTML = `<div class="sheet"><h2>시세 서버는 연결됐습니다. 이제 API 키만 넣으면 됩니다</h2>${SETUP}</div>`;
      return;
    }
    const problems = live ? names.filter((k) => src[k] && src[k].configured && !src[k].ok)
      .map((k) => `<span><strong>${SOURCE_LABEL[k]}</strong>: ${esc(src[k].error || "조회 실패")}${src[k].stale ? " (직전 값을 표시 중)" : ""}</span>`) : [];
    const missing = live ? names.filter((k) => src[k] && !src[k].configured).map((k) => SOURCE_LABEL[k]) : [];

    // 스냅샷이 오래됐으면 눈에 띄게 알린다 (폰·브라우저에서는 Mac에서 마지막으로 열었을 때의 숫자다)
    const age = Date.now() - p.ts;
    const staleNote = !live && age > 2 * 3600000 ? `<div class="notice"><span><strong>${esc(agoText(age))} 숫자입니다.</strong> Mac의 Claude 앱에서 Axis가 열려 있을 때만 갱신됩니다. 장이 끝나면 결과가 폰 푸시(장 마감 요약)로 옵니다.</span></div>` : "";
    const figures = `
      <div class="figures">
        <div class="fig hero-total"><span class="label">총 평가금액</span><span class="value num">${won(c.total)}</span></div>
        <div class="fig"><span class="label">오늘 손익</span>
          <span class="value num ${dir(c.day)}">${arrow(c.day)}${signWon(c.day)}</span>
          <span class="sub num ${dir(c.day)}">${c.dayRate === null ? "" : pct(c.dayRate)}</span>
          ${Math.abs(c.fxDay) >= 1 ? `<span class="sub muted num">주가 ${signCompact(c.stockDay)} · 환율 ${signCompact(c.fxDay)}</span>` : ""}
          <span class="sub muted">${esc(marketBasis(p.ts))}</span></div>
        <div class="fig"><span class="label">평가 손익</span>
          <span class="value num ${dir(c.pnl)}">${arrow(c.pnl)}${signWon(c.pnl)}</span>
          <span class="sub num ${dir(c.pnl)}">${c.pnlRate === null ? "" : pct(c.pnlRate)}</span></div>
        <div class="fig"><span class="label">원/달러 환율</span>
          <span class="value num">${c.fx ? c.fx.toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "원" : "확인 불가"}</span>
          <span class="sub muted">미국주식 원화 환산에 사용</span></div>
      </div>`;

    // 비중 중심 표: 종목 · 비중 · 평가금액 · 평가손익 · 오늘. 수량과 단가는 종목명 아래 보조 정보로 둔다.
    const inUsd = S.ccy === "USD";
    const hasUs = c.rows.some((r) => r.ccy === "USD") || (p.cash || []).some((x) => x.ccy === "USD" && x.amount > 0);
    const maxW = Math.max(...c.rows.map((r) => r.value / c.total), c.byClass.cash / c.total, 0.0001);
    const colorOf = (cls) => (CLASSES.find((x) => x.key === cls) || CLASSES[3]).color;
    const wcell = (w, color, scale) => `<div class="wcell"><div class="wtrack"><span style="width:${Math.min(100, (w / scale) * 100).toFixed(1)}%;background:${color}"></span></div><strong class="num">${share(w)}</strong></div>`;
    const dollar = (r) => inUsd && r.ccy === "USD";
    const valueText = (r) => dollar(r) ? usd(r.qty * r.price) + `<span class="two muted">${won(r.value)}</span>` : won(r.value);
    const pnlText = (r) => {
      if (dollar(r) && r.avg) { const v = r.qty * (r.price - r.avg); return `<span class="${dir(v)}">${signUsd(v)}<span class="two">${pct(r.price / r.avg - 1)}</span></span>`; }
      return r.pnl === null ? '<span class="muted">–</span>' : `<span class="${dir(r.pnl)}">${signWon(r.pnl)}<span class="two">${pct(r.pnlRate)}</span></span>`;
    };
    // 오늘: 등락률과 그 종목이 오늘 만든 손익(원화, 달러로 볼 때는 달러)
    const dayText = (r) => r.dayRate === null ? '<span class="muted">–</span>'
      : arrow(r.day) + pct(r.dayRate) + `<span class="two">${dollar(r) ? signUsd(r.qty * (r.price - r.prev_close)) : signWon(r.day)}</span>`;
    const groupDay = (rows) => { const v = rows.reduce((a, r) => a + (r.day || 0), 0); return rows.some((r) => r.dayRate !== null) ? `<span class="${dir(v)}">${signWon(v)}</span>` : ""; };
    const meta = (r) => `${qtyText(r.qty)}${r.cls === "crypto" ? "" : "주"} · 평단 ${r.avg ? px(r.avg, r.ccy) : "없음"} · 현재 ${px(r.price, r.ccy)}`;
    const row = (r, showClass) => `<tr>
          <td><span class="name">${esc(r.name)}</span><span class="sym">${esc(r.symbol)}${showClass ? " · " + (CLASSES.find((x) => x.key === r.cls) || {}).label : ""}</span><span class="meta num">${meta(r)}</span></td>
          <td class="w">${wcell(r.value / c.total, colorOf(r.cls), maxW)}</td>
          <td class="num">${valueText(r)}</td>
          <td class="num">${pnlText(r)}</td>
          <td class="num ${dir(r.day || 0)}">${dayText(r)}</td></tr>`;
    const cashRows = (p.cash || []).filter((x) => x.amount > 0);
    const cashRow = (x) => {
      const krw = x.ccy === "USD" ? (c.fx ? x.amount * c.fx : null) : x.amount;
      const val = x.ccy === "USD" && inUsd ? usd(x.amount) + (krw === null ? "" : `<span class="two muted">${won(krw)}</span>`) : krw === null ? "–" : won(krw);
      return `<tr><td><span class="name">${esc(x.label)}</span>${x.ccy === "USD" && !inUsd ? `<span class="meta num">${usd(x.amount)}</span>` : ""}</td>
        <td class="w">${krw === null ? "" : wcell(krw / c.total, "var(--s-cash)", maxW)}</td><td class="num">${val}</td><td></td><td></td></tr>`;
    };
    let body = "";
    if (S.hView === "rank") {
      body = c.rows.map((r) => row(r, true)).join("") + cashRows.map(cashRow).join("");
    } else if (S.hView === "day") {                   // 오늘 영향순: 오늘 손익(원화)의 크기 순, 오르고 내린 것을 섞어서
      body = c.rows.slice().sort((a, b) => Math.abs(b.day || 0) - Math.abs(a.day || 0)).map((r) => row(r, true)).join("");
    } else {
      for (const cls of CLASSES.filter((x) => x.key !== "cash")) {
        const rows = c.rows.filter((r) => r.cls === cls.key);
        if (!rows.length) continue;
        const usdSum = cls.key === "us" && inUsd ? rows.reduce((a, r) => a + r.qty * r.price, 0) : null;
        body += `<tr class="group"><td><span class="sw" style="background:${cls.color}"></span>${cls.label} · ${rows.length}종목</td><td class="w">${wcell(c.byClass[cls.key] / c.total, cls.color, 1)}</td><td class="num">${usdSum === null ? won(c.byClass[cls.key]) : usd(usdSum)}</td><td></td><td class="num">${groupDay(rows)}</td></tr>`;
        body += rows.map((r) => row(r, false)).join("");
      }
      if (cashRows.length) {
        body += `<tr class="group"><td><span class="sw" style="background:var(--s-cash)"></span>현금</td><td class="w">${wcell(c.byClass.cash / c.total, "var(--s-cash)", 1)}</td><td class="num">${won(c.byClass.cash)}</td><td></td><td></td></tr>`;
        body += cashRows.map(cashRow).join("");
      }
    }
    const viewChips = `<div class="chips" role="group" aria-label="정렬">${[["class", "자산군별"], ["rank", "비중순"], ["day", "오늘 영향순"]].map(([k, l]) =>
      `<button class="chip" type="button" data-hview="${k}" aria-pressed="${S.hView === k}">${l}</button>`).join("")}</div>`;

    el.innerHTML = `
      ${errNote}${staleNote}
      ${problems.length ? `<div class="notice">${problems.join("")}</div>` : ""}
      ${alertBanner(c)}
      <div class="hero">${figures}</div>
      <div class="sheet">
        <div class="bar-head"><h2>포트폴리오 비중</h2><div class="toolbar">${viewChips}${hasUs ? ccyChips() : ""}</div></div>
        ${c.total > 0 ? allocBar(c.byClass, c.total) + allocLegend(c.byClass, c.total) : ""}
        <div class="scroll"><table class="weights${S.hView === "day" ? " dayv" : ""}">
          <thead><tr><th>종목</th><th class="w">비중</th><th>평가금액</th><th>평가손익</th><th>오늘</th></tr></thead>
          <tbody>${body || `<tr><td colspan="5" class="muted">보유 종목이 없습니다.</td></tr>`}</tbody>
        </table></div>
        <p class="small muted">비중은 현금을 포함한 총 평가금액 대비입니다. 막대 길이는 ${S.hView !== "class" ? "가장 큰 종목" : "자산군 행은 전체, 종목 행은 가장 큰 종목"}을 기준으로 맞췄습니다. '오늘'의 금액은 그 종목의 주가 움직임만 담았고, 미국주식의 환율 움직임은 위쪽 '오늘 손익'에 환율 효과로 따로 더했습니다. ${c.hidden.length ? `평가금액 ${nf0.format(DUST_KRW)}원 미만이거나 원화 시세가 없는 ${c.hidden.length}종목은 표에서 뺐습니다. ` : ""}주식의 평가손익은 키움이 계산한 값(예상 매도 비용 차감)이고, 미국주식은 매입 당시 환율을 반영한 원화 기준입니다.${inUsd ? " 달러로 보면 미국주식 손익은 환율 효과를 뺀 주가 수익만 보여 줍니다." : ""} 코인의 '오늘'은 오전 9시 대비입니다.${missing.length ? ` ${missing.join(", ")}은 아직 API 키가 없어 빠져 있습니다.` : ""}</p>
        ${live ? `<ul class="sources">${names.map((k) => `<li>${SOURCE_LABEL[k]}: ${!src[k] || !src[k].configured ? "키 없음" : src[k].ok ? "연결됨" : "오류"}</li>`).join("")}</ul>` : ""}
      </div>
      ${alertSettings()}`;
    if (focusId && $(focusId)) $(focusId).focus();
  }

  // ── 알림 ─────────────────────────────────────────────
  // 종목 알림은 두 조건 중 하나: ① 등락률이 기준 이상(비중이 min_weight_pct 이상인 종목만) ② 그 종목의 오늘 손익이 총자산의 impact_pct 이상.
  // Mac의 장중 점검(server.py --alerts)도 같은 규칙을 쓰고, 같은 움직임이 기준의 2배·4배를 넘으면 '더 커짐'으로 한 번 더 보낸다.
  const ALERT_DEFAULT = { enabled: true, push: true, digest: true, day_move_pct: 5, min_weight_pct: 2, impact_pct: 0.3, total_day_pct: 3 };
  const ALERT_NUM = ["day_move_pct", "min_weight_pct", "impact_pct", "total_day_pct"];
  const alertCfg = () => { const a = Object.assign({}, ALERT_DEFAULT, S.alerts || {}); delete a.loss_pct; delete a.gain_pct; return a; };
  const symTag = (h) => (h.cls === "us" ? "$" : "") + h.symbol;
  function alertList(c) {
    const a = alertCfg(), out = [];
    if (!a.enabled || !c || !c.total) return out;
    if (a.total_day_pct > 0 && c.dayRate !== null && Math.abs(c.dayRate) * 100 >= a.total_day_pct)
      out.push({ key: "total", dir: dir(c.day), text: `총자산이 오늘 ${pct(c.dayRate)} (${signWon(c.day)}) 움직였습니다` });
    for (const r of c.rows) {
      if (r.dayRate === null) continue;
      const w = (r.value / c.total) * 100, impact = (r.day / c.total) * 100;
      const byMove = a.day_move_pct > 0 && w >= (a.min_weight_pct || 0) && Math.abs(r.dayRate) * 100 >= a.day_move_pct;
      const byImpact = a.impact_pct > 0 && Math.abs(impact) >= a.impact_pct;
      if (byMove || byImpact)
        out.push({ key: "d:" + r.id, dir: dir(r.dayRate), text: `${r.name} (${symTag(r)}) 오늘 ${pct(r.dayRate)} · ${signWon(r.day)} (총자산 ${pct(impact / 100)})` });
    }
    return out;
  }
  const hiddenKey = () => "axis.alerts.hidden." + kstDate(Date.now());
  function alertsHidden(sig) { try { return localStorage.getItem(hiddenKey()) === sig; } catch (e) { return false; } }
  function alertBanner(c) {
    const list = alertList(c);
    if (!list.length) return "";
    const sig = list.map((x) => x.key).sort().join("|");
    if (alertsHidden(sig)) return "";
    return `<div class="alerts" role="status"><div class="ah"><strong>알림 ${list.length}건</strong><button class="ghost" type="button" data-alert-hide="${esc(sig)}">오늘 숨기기</button></div>
      <ul>${list.slice(0, 8).map((x) => `<li class="${x.dir}">${esc(x.text)}</li>`).join("")}</ul>${list.length > 8 ? `<span class="small" style="color:var(--hero-muted)">외 ${list.length - 8}건</span>` : ""}</div>`;
  }

  // 목표 알림: 평단 대비 수익률 또는 가격. 목록은 Mac(alert-settings.json)에 있고, 추가·삭제는 Mac의 Claude 앱에서 연 이 화면에서 한다.
  const serverTargets = () => (S.live && S.live.alert_settings && Array.isArray(S.live.alert_settings.targets) ? S.live.alert_settings.targets : []);
  const TARGET_KINDS = [["pnl", "평단 대비 수익률"], ["above", "가격 이상"], ["below", "가격 이하"]];
  function targetCondition(x, h) {
    const ccy = h ? h.ccy : /^\d{6}$/.test(x.symbol) ? "KRW" : "USD";
    if (x.price) return `${px(x.price, ccy)} ${x.dir === "below" ? "이하" : "이상"}`;
    return `평단 대비 ${sign(x.pnl_pct)}${esc(Math.abs(x.pnl_pct))}%`;
  }
  const targetable = () => { const cur = current(); return cur ? compute(cur.p).rows : []; };   // 표에 보이는 종목 (1,000원 미만 잔고 제외)
  function targetSection() {
    const t = serverTargets(), hs = targetable();
    const find = (sym) => hs.find((y) => (y.symbol || "").toUpperCase() === String(sym).toUpperCase());
    const list = t.length ? `<ul class="plain" style="margin-top:8px">${t.map((x) => {
      const h = find(x.symbol), label = h ? `${esc(h.name)} (${esc(symTag(h))})` : esc(x.symbol);
      const now = h ? (x.price ? ` · 지금 ${px(h.price, h.ccy)}` : "") : " · 지금 보유하지 않음";
      return `<li>${label} ${targetCondition(x, h)} <span class="small muted">${x.done_at ? "보냄 · " + esc(String(x.done_at).slice(0, 16).replace("T", " ")) : "기다리는 중" + now}</span>${
        S.mcp ? ` <button class="chip" type="button" data-alert-act="tdel" data-tid="${esc(x.id)}">삭제</button>` : ""}</li>`;
    }).join("")}</ul>` : `<p class="small muted" style="margin-top:6px">설정한 목표가 없습니다.</p>`;
    if (!S.mcp) return `<div><h3>목표 알림</h3>${list}<p class="small muted">목표는 Mac의 Claude 앱에서 이 화면을 열었을 때 추가·삭제할 수 있습니다.</p></div>`;
    const d = S.alertDraft, sym = d.t_sym || (hs[0] ? hs[0].symbol : ""), kind = d.t_kind || "pnl", h = find(sym);
    const unit = kind === "pnl" ? "%" : h && h.ccy === "USD" ? "$" : "원";
    const sorted = hs.slice().sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
    return `<div><h3>목표 알림</h3>${list}
      <div class="jform" style="margin-top:12px">
        <label class="field grow"><span>종목</span><select id="t-sym" data-alert="t_sym">${sorted.map((x) =>
          `<option value="${esc(x.symbol)}"${x.symbol === sym ? " selected" : ""}>${esc(x.name)} (${esc(symTag(x))})</option>`).join("")}</select></label>
        <label class="field"><span>기준</span><select id="t-kind" data-alert="t_kind">${TARGET_KINDS.map(([k, l]) =>
          `<option value="${k}"${k === kind ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="field"><span>값</span><span class="unit"><input type="number" inputmode="decimal" step="any" id="t-val" data-alert="t_val" value="${esc(d.t_val || "")}" placeholder="${kind === "pnl" ? "−15" : h ? h.price : ""}"> ${unit}</span></label>
        <button class="btn" type="button" data-alert-act="tadd">목표 추가</button>
      </div>
      <p class="small muted" style="margin-top:6px">${h ? `${esc(h.name)} 지금 ${px(h.price, h.ccy)}${typeof pnlRateOf(h) === "number" ? ` · 평단 대비 ${pct(pnlRateOf(h))}` : ""}. ` : ""}손절은 음수(예: −15), 익절은 양수로 적습니다. 도달하면 폰으로 한 번 보내고 '보냄'으로 바뀝니다.</p></div>`;
  }
  // 평단 대비 수익률: 서버의 목표 알림 판정과 같은 식 (키움 원화 평가손익이 있으면 그것)
  function pnlRateOf(h) {
    const cur = current(), fx = cur && cur.p.fx ? cur.p.fx.usdkrw : null;
    const c0 = h.ccy === "USD" && h.avg_krw ? h.qty * h.avg_krw : h.avg ? h.qty * h.avg * (h.ccy === "USD" ? fx || 0 : 1) : 0;
    if (typeof h.pnl_krw === "number" && c0) return h.pnl_krw / c0;
    return h.avg && h.price ? h.price / h.avg - 1 : null;
  }
  function alertSettings() {
    const a = alertCfg(), d = S.alertDraft;
    const val = (k) => esc(d[k] !== undefined ? d[k] : a[k] || "");
    const field = (k, label, help, step) => `<label class="field"><span>${label}</span><span class="unit"><input type="number" inputmode="decimal" min="0" max="100" step="${step || 0.5}" id="al-${k}" data-alert="${k}" value="${val(k)}" placeholder="끔"> %</span><span class="small muted" style="font-weight:400">${help}</span></label>`;
    return `<div class="sheet"><details class="fold" id="h-alertset"${S.hOpen.alertSet ? " open" : ""}><summary>알림 설정 <span class="small muted">${a.enabled ? (a.push ? "켜짐 · 폰 푸시" : "켜짐") : "꺼짐"}</span></summary>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="aset">
          ${field("day_move_pct", "종목 하루 등락", "이만큼 오르거나 내리면")}
          ${field("min_weight_pct", "등락 알림 최소 비중", "이보다 작은 종목의 등락은 거름", 0.5)}
          ${field("impact_pct", "종목 손익 · 총자산 대비", "한 종목이 총자산을 이만큼 움직이면", 0.1)}
          ${field("total_day_pct", "총자산 하루 등락", "포트폴리오 전체 기준")}
        </div>
        <div class="jactions">
          <button class="btn" type="button" data-alert-act="save">저장</button>
          <button class="chip" type="button" data-alert-act="toggle" aria-pressed="${a.enabled}">${a.enabled ? "알림 켜짐" : "알림 꺼짐"}</button>
          <button class="chip" type="button" data-alert-act="push" aria-pressed="${a.enabled && a.push}"${a.enabled ? "" : " disabled"}>${a.push ? "폰 푸시 켜짐" : "폰 푸시 꺼짐"}</button>
          <button class="chip" type="button" data-alert-act="digest" aria-pressed="${a.enabled && a.push && a.digest}"${a.enabled && a.push ? "" : " disabled"}>${a.digest ? "장 마감 요약 켜짐" : "장 마감 요약 꺼짐"}</button>
          <span class="small muted" role="status">${esc(S.alertMsg)}</span>
        </div>
        <p class="small muted">하루 동안의 움직임만 봅니다(전일 종가 대비, 코인은 오전 9시 대비). 종목은 등락률 기준이나 총자산 대비 손익 기준 중 하나만 넘어도 알립니다. 조건에 맞으면 이 화면 위쪽과 아침 브리핑에 표시되고, 폰 푸시를 켜 두면 Mac이 5분마다 점검해 ntfy 앱으로 알려 드립니다. 같은 움직임은 한 번만 보내되, 기준의 2배·4배를 넘으면 '더 커짐'으로 한 번 더 보냅니다. 장 마감 요약은 국내장(15:40 무렵)과 미국장(뉴욕 16:05 무렵, 한국 시간 새벽 5~6시)이 끝나면 하루 손익과 상위·하위 종목을 한 번 보냅니다. 그 시간에 Mac이 잠들어 있으면 건너뜁니다. 0이나 빈칸은 그 조건을 끕니다.${S.live ? (S.live.push_ready ? "" : " 폰 푸시 채널이 아직 설정되지 않았습니다.") : " 설정을 Mac에 반영하려면 Mac의 Claude 앱에서 이 화면을 한 번 열어야 합니다."}</p>
        ${targetSection()}
      </div></details></div>`;
  }
  let alertSyncSig = null, alertSyncRetry = 0;
  async function syncAlertsToServer(p) {
    if (!S.mcp || !S.alertsLoaded || !p || Date.now() < alertSyncRetry) return;
    const a = alertCfg(), want = { enabled: !!a.enabled, push: !!a.push, digest: !!a.digest };
    for (const k of ALERT_NUM) want[k] = Number(a[k]) || 0;
    const sig = JSON.stringify(want), have = p.alert_settings;
    if (sig === alertSyncSig) return;
    if (have && Object.keys(want).every((k) => have[k] == want[k])) { alertSyncSig = sig; return; }
    alertSyncSig = sig;
    try { await S.mcp.callTool(SERVER, "save_alert_settings", want, { cache: false }); }
    catch (e) { alertSyncSig = null; alertSyncRetry = Date.now() + 5 * 60 * 1000; }   // 앱 재시작 전이라 도구가 없을 수 있다: 5분 뒤 다시
  }
  // 목표 목록은 Mac에만 있으므로 저장소를 거치지 않고 바로 서버에 저장한다
  async function saveTargets(list, msg) {
    try {
      const r = await S.mcp.callTool(SERVER, "save_alert_settings", { targets: list }, { cache: false });
      const saved = r && r.payload;
      if (!saved || !Array.isArray(saved.targets)) throw new Error("bad");
      if (S.live) S.live = { ...S.live, alert_settings: saved };
      S.alertMsg = msg; return true;
    } catch (e) { S.alertMsg = "목표를 저장하지 못했습니다. Mac의 Claude 앱을 다시 시작한 뒤 해 보세요."; return false; }
  }
  async function alertAction(act, tid) {
    if (act === "tadd" || act === "tdel") {
      if (!S.mcp) return;
      const cur = serverTargets().map((x) => ({ ...x }));
      if (act === "tdel") { await saveTargets(cur.filter((x) => x.id !== tid), "목표를 지웠습니다."); renderHoldings(); return; }
      const d = S.alertDraft, hs = targetable();
      const sym = d.t_sym || (hs[0] ? hs[0].symbol : ""), kind = d.t_kind || "pnl", v = Number(String(d.t_val || "").replace(/[−–]/g, "-").replace(/[,$원%\s]/g, ""));
      if (!sym) { S.alertMsg = "종목을 고르세요."; renderHoldings(); return; }
      if (!String(d.t_val || "").trim() || !isFinite(v) || v === 0 || (kind !== "pnl" && v < 0) || (kind === "pnl" && v <= -100)) {
        S.alertMsg = kind === "pnl" ? "수익률을 숫자로 적어 주세요 (예: −15, 30)." : "가격을 0보다 큰 숫자로 적어 주세요."; renderHoldings(); return;
      }
      const item = kind === "pnl" ? { symbol: sym, pnl_pct: v } : { symbol: sym, price: v, dir: kind };
      if (await saveTargets([...cur, { ...item, created_at: new Date().toISOString() }], "목표를 추가했습니다.")) { delete S.alertDraft.t_val; }
      renderHoldings(); return;
    }
    if (!S.db) { S.alertMsg = "저장소에 연결되지 않아 저장할 수 없습니다."; renderHoldings(); return; }
    const a = alertCfg(), next = { ...a };
    if (act === "toggle") next.enabled = !a.enabled;
    else if (act === "push") next.push = !a.push;
    else if (act === "digest") next.digest = !a.digest;
    else {
      for (const k of ALERT_NUM) {
        if (S.alertDraft[k] === undefined) continue;
        const raw = String(S.alertDraft[k]).trim(), v = raw === "" ? 0 : Number(raw);
        if (!isFinite(v) || v < 0 || v > 100) { S.alertMsg = "0에서 100 사이 숫자를 넣어 주세요."; renderHoldings(); return; }
        next[k] = Math.round(v * 100) / 100;
      }
    }
    next.updated_at = new Date().toISOString();
    try {
      await S.db.doc("settings/alerts").set(next); S.alerts = next;
      for (const k of ALERT_NUM) delete S.alertDraft[k];
      S.alertMsg = act === "save" ? "저장했습니다." : "";
    }
    catch (e) { S.alertMsg = "저장하지 못했습니다. 잠시 뒤 다시 시도하세요."; }
    renderHoldings();
  }

  // ── 브리핑 탭 ─────────────────────────────────────────
  // 날짜 목록은 가벼운 briefing_index 에서, 본문은 고른 날짜 하나만 불러온다 (최신 본문은 실시간 구독)
  function loadBrief(date) {
    if (!S.db || S.briefBodies[date]) return;
    S.briefBodies[date] = "loading";
    S.db.doc("briefings/" + date).get()
      .then((snap) => { S.briefBodies[date] = snap.exists ? snap.data() : "missing"; })
      .catch(() => { S.briefBodies[date] = "error"; })
      .finally(() => { if (S.tab === "briefing") renderBriefing(); });
  }
  // 날짜 선택기: dates 는 최신순. '이전'은 더 오래된 날, '다음'은 더 최근 날. 버튼은 기존 data-brief/data-lab 클릭 처리를 그대로 쓴다.
  function datePicker(kind, dates, sel, label) {
    if (dates.length < 2) return "";
    const i = Math.max(0, dates.indexOf(sel)), older = dates[i + 1], newer = dates[i - 1];
    const btn = (d, text, aria) => `<button class="step" type="button" ${d ? `data-${kind}="${esc(d)}"` : "disabled"} aria-label="${esc(aria + (d ? ": " + dateLabel(d) : ""))}">${text}</button>`;
    return `<div class="dpick" role="group" aria-label="${esc(label)}">
      ${btn(older, "‹ 이전", "이전 날짜")}
      <label class="picker"><span class="sr">${esc(label)}</span>
        <select id="${kind}-date-select">${dates.map((d) => `<option value="${esc(d)}"${d === dates[i] ? " selected" : ""}>${d.slice(0, 4) !== String(new Date().getFullYear()) ? esc(d.slice(0, 4)) + "년 " : ""}${esc(dateLabel(d))}</option>`).join("")}</select>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
      ${btn(newer, "다음 ›", "다음 날짜")}
    </div>`;
  }
  // 위험 신호(집중·동조화·낙폭·하루 손실·코인-주식 상관): 내 데이터의 지난 1년과 비교한 사실만. 실시간 응답이 기준이고, 없으면 브리핑 시점 값.
  // 주의·경고 단계에서는 detail 아래에 점검 질문을 작게 보여 준다.
  const SIG_WORD = { green: "정상", yellow: "주의", red: "경고" };
  function signalStrip(payload, note) {
    const list = payload && Array.isArray(payload.signals) ? payload.signals : [];
    if (!list.length) return "";
    const item = (x) => {
      const st = SIG_WORD[x.status] ? x.status : "";
      return `<div class="sig ${st}" role="listitem" title="${esc(x.threshold || "")}">
        <span class="light ${st}" aria-hidden="true"></span>
        <div class="sb"><div class="sh"><strong>${esc(x.label)}</strong><span class="sv num">${esc(x.value_text || "–")}</span><span class="sr">${esc(SIG_WORD[st] || "계산 안 됨")}</span></div>
        ${x.metrics_text ? `<span class="sm">${esc(x.metrics_text)}</span>` : ""}
        <span class="sd">${esc(x.detail || "")}</span>
        ${(st === "yellow" || st === "red") && x.question ? `<span class="sq">점검: ${esc(x.question)}</span>` : ""}</div></div>`;
    };
    return `<div><h3>위험 신호 <span class="small muted" style="font-weight:400">${esc(note)}</span></h3>
      <div class="sigs" role="list" style="margin-top:8px">${list.map(item).join("")}</div></div>`;
  }
  function liveSignals() {
    const g = S.live && S.live.signals;
    return g && Array.isArray(g.signals) && g.signals.some((x) => x.status) ? g : null;
  }
  function renderBriefing() {
    const el = $("panel-briefing");
    const idx = new Map(S.briefIndex.map((x) => [x.date, x]));
    if (S.briefLatest && !idx.has(S.briefLatest.date)) idx.set(S.briefLatest.date, { date: S.briefLatest.date, headline: S.briefLatest.headline });
    const dates = [...idx.keys()].sort().reverse();
    if (!dates.length) {
      el.innerHTML = !S.briefLoaded ? `<div class="sheet"><p class="muted">브리핑을 불러오는 중입니다.</p></div>`
        : `<div class="sheet"><h2>첫 브리핑은 다음 날 아침 7시 30분에 도착합니다</h2>
        <p class="prose">매일 아침 예약 작업이 밤사이 금리·달러·유가·주식·코인 흐름과 보유 종목 소식을 정리해 이곳에 올립니다. 그 시간에 Mac이 켜져 있고 Claude 앱이 실행 중이어야 하며, 꺼져 있었다면 앱을 켤 때 실행됩니다.</p></div>`;
      return;
    }
    const sel = dates.includes(S.briefDate) ? S.briefDate : dates[0];
    const chips = datePicker("brief", dates, sel, "브리핑 날짜");
    const b = S.briefLatest && S.briefLatest.date === sel ? S.briefLatest : S.briefBodies[sel];
    if (!b || typeof b === "string") {
      if (!b) loadBrief(sel);
      const msg = b === "missing" ? "이 날짜의 브리핑 본문을 찾지 못했습니다." : b === "error" ? "브리핑을 불러오지 못했습니다. 날짜를 다시 누르면 다시 시도합니다." : "브리핑을 불러오는 중입니다.";
      el.innerHTML = `${chips}<div class="sheet"><p class="muted">${msg}</p></div>`;
      return;
    }
    const isNum = (v) => typeof v === "number" && isFinite(v);
    const sgn = (v, d, unit) => !isNum(v) ? '<span class="muted">–</span>' : `<span class="${dir(v)}">${sign(v)}${Math.abs(v).toFixed(d)}${unit}</span>`;
    const chg = (r, k) => r.unit === "bp" ? sgn(r[k], 1, "bp") : r.unit === "pt" ? sgn(r[k], 2, "") : sgn(r[k], 2, "%");
    const lastText = (r) => r.unit === "bp" ? r.last.toFixed(3) + "%" : r.last.toLocaleString("en-US", { maximumFractionDigits: r.last < 20 ? 3 : 2 });
    const link = (t, u) => { const x = safeUrl(u); return x ? `<a href="${esc(x)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>` : esc(t); };

    // 오늘의 논점: 문자열 하나(예전 형식) 또는 [{label, text}] 문단들
    const th = Array.isArray(b.thesis) ? b.thesis : b.thesis ? [{ text: b.thesis }] : [];
    const thesis = th.length ? `<div class="thesis">${th.map((x) => typeof x === "string" ? `<p>${rich(x)}</p>`
      : `<section>${x.label ? `<h3>${esc(x.label)}</h3>` : ""}<p>${rich(x.text)}</p></section>`).join("")}</div>` : "";

    // 시장 수치
    let dash = "";
    const D = b.dashboard, mrows = Array.isArray(D) ? D
      : D && Array.isArray(D.cols) && Array.isArray(D.rows) ? D.rows.map((r) => Object.fromEntries(D.cols.map((c, i) => [c, r[i]]))) : [];
    if (mrows.length) {
      let rows = "", g = null;
      for (const r of mrows) {
        if (!isNum(r.last)) continue;
        if (r.group !== g) { g = r.group; rows += `<tr class="group"><td colspan="6">${esc(g)}</td></tr>`; }
        const pos = isNum(r.range_52w_pos) ? Math.max(0, Math.min(1, r.range_52w_pos)) : null;
        rows += `<tr><td title="${esc(r.asof_kst ? r.asof_kst + " 기준" : "")}">${esc(r.label)}</td><td class="num">${lastText(r)}</td>
          <td class="num">${chg(r, "chg_1d")}</td><td class="num">${chg(r, "chg_1w")}</td><td class="num">${chg(r, "chg_1m")}</td>
          <td class="r52">${pos === null ? "" : `<div class="r52bar${pos >= 0.9 ? " hi" : pos <= 0.1 ? " lo" : ""}" role="img" aria-label="52주 범위의 ${Math.round(pos * 100)}% 위치"><span style="left:${(pos * 100).toFixed(0)}%"></span></div>`}</td></tr>`;
      }
      const ex = b.dashboard_extra || {};
      const extra = [isNum(ex.us_10y_3m_spread_bp) ? `미 10년−3개월 금리차 <strong>${sign(ex.us_10y_3m_spread_bp)}${Math.abs(ex.us_10y_3m_spread_bp).toFixed(0)}bp</strong>` : "",
        isNum(ex.fed_funds_implied) ? `연방기금 선물 내재 금리 <strong>${ex.fed_funds_implied.toFixed(2)}%</strong>` : ""].filter(Boolean);
      dash = `<div class="sheet"><h2>시장 수치</h2>
        <div class="scroll"><table class="mkt"><thead><tr><th>지표</th><th>현재</th><th>1일</th><th>1주</th><th>1개월</th><th class="r52">52주 위치</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${extra.length ? `<div class="kv">${extra.map((x) => `<span>${x}</span>`).join("")}</div>` : ""}
        <p class="small muted">야후 파이낸스 시세 기준. 지표 이름에 마우스를 올리면 기준 시각(한국 시간)이 보입니다. 금리 변화는 bp, VIX는 포인트, 나머지는 %입니다. 52주 위치 막대가 오른쪽 끝이면 52주 최고, 왼쪽 끝이면 최저입니다.</p></div>`;
    }

    // 매크로 주제
    const topics = (b.macro || []).map((m) => `<div class="topic"><h3>${esc(m.topic)}</h3><div class="body">
        ${m.what ? `<p class="what">${rich(m.what)}</p>` : ""}${m.why ? `<p>${rich(m.why)}</p>` : ""}
        ${m.so_what ? `<div class="sowhat"><span class="lb">내 포트폴리오</span><span>${rich(m.so_what)}</span></div>` : ""}
        ${(m.sources || []).length ? `<div class="srcs">${m.sources.map((x) => `<span>${link(x.source || x.title, x.url)}</span>`).join("")}</div>` : ""}
      </div></div>`).join("");
    const market = (b.market || []).map((m) => `<dt>${esc(m.label)}</dt><dd>${esc(m.text)}</dd>`).join("");
    const macro = topics ? `<div class="sheet"><h2>매크로</h2><div class="topics">${topics}</div></div>`
      : market ? `<div class="sheet"><h2>시장 요약</h2><dl class="market">${market}</dl></div>` : "";

    // 내 포트폴리오
    let port = "";
    const P = b.portfolio;
    if (P) {
      const mv = (x) => `<li><span>${esc(x.name)} <span class="muted num">${isNum(x.move_pct) ? sign(x.move_pct) + Math.abs(x.move_pct).toFixed(2) + "%" : ""}</span></span><span class="num ${dir(x.pnl_krw)}">${isNum(x.pnl_krw) ? signWon(x.pnl_krw) : ""}</span></li>`;
      const sens = (P.sensitivity || []).map((x) => `<tr><td>${esc(x.factor)}</td><td>${esc(x.per)} 오를 때</td><td class="num">${sgn(x.port_move_pct, 2, "%")}</td><td class="num ${dir(x.krw)}">${isNum(x.krw) ? signWon(x.krw) : ""}</td><td class="num">${isNum(x.corr) ? x.corr.toFixed(2) : ""}</td></tr>`).join("");
      port = `<div class="sheet"><h2>내 포트폴리오</h2>
        <div class="tiles">
          <div class="fig"><span class="label">하루 손익</span><span class="value num ${dir(P.day_pnl_krw || 0)}">${isNum(P.day_pnl_krw) ? signWon(P.day_pnl_krw) : "–"}</span><span class="sub num ${dir(P.day_pnl_pct || 0)}">${isNum(P.day_pnl_pct) ? sign(P.day_pnl_pct) + Math.abs(P.day_pnl_pct).toFixed(2) + "%" : ""}</span></div>
          <div class="fig"><span class="label">달러 자산 비중</span><span class="value num">${isNum(P.usd_exposure_pct) ? P.usd_exposure_pct.toFixed(1) + "%" : "–"}</span><span class="sub muted">원/달러 움직임에 노출</span></div>
          <div class="fig"><span class="label">상위 5종목 비중</span><span class="value num">${isNum(P.top5_pct) ? P.top5_pct.toFixed(1) + "%" : "–"}</span></div>
        </div>
        ${P.drivers ? `<div class="prose"><p>${rich(P.drivers)}</p></div>` : ""}
        ${(P.gainers || []).length || (P.losers || []).length ? `<div class="movers">
          <div><h3>손익 기여 상위</h3><ul>${(P.gainers || []).map(mv).join("") || '<li class="muted">없음</li>'}</ul></div>
          <div><h3>손익 기여 하위</h3><ul>${(P.losers || []).map(mv).join("") || '<li class="muted">없음</li>'}</ul></div></div>` : ""}
        ${sens ? `<div><h3>매크로 민감도</h3><div class="scroll" style="margin-top:8px"><table class="sens"><thead><tr><th>요인</th><th>기준</th><th>포트폴리오 평균</th><th>금액</th><th>상관</th></tr></thead><tbody>${sens}</tbody></table></div>
          <p class="small muted" style="margin-top:6px">지난 1년 동안 하루 변화에 대한 지금 구성의 평균 반응(단순 회귀)입니다. 상관이 낮은 요인은 참고만 하세요. 한국·미국 장 시차는 보정하지 않았습니다.</p></div>` : ""}
        ${P.note ? `<div class="sowhat"><span class="lb">관찰</span><span>${rich(P.note)}</span></div>` : ""}
      </div>`;
    }

    // 보유 종목 소식
    const groups = new Map();
    for (const it of b.items || []) { const k = it.name || "기타"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
    const news = [...groups].map(([name, items]) => `<div class="news-group"><h3>${esc(name)}${items[0].move ? ` <span class="small muted">${esc(items[0].move)}</span>` : ""}</h3>` + items.map((it) =>
      `<div class="news-item"><span class="t">${link(it.title, it.url)}</span>
        <span>${rich(it.summary)}</span>${it.impact ? `<span class="imp">${rich(it.impact)}</span>` : ""}<span class="small muted">${esc([it.source, it.published].filter(Boolean).join(" · "))}</span></div>`).join("") + `</div>`).join("");

    // 일정과 체크포인트

    const alertsBox = (b.alerts || []).length ? `<div class="alerts"><div class="ah"><strong>아침 알림 ${b.alerts.length}건</strong></div><ul>${b.alerts.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
    const details = `${dash}${macro}${port}

    const live = liveSignals();

    const liveStrip = live ? signalStrip(live, `지금 · ${live.asof ? esc(String(live.asof).slice(11, 16)) : ""} 기준`) : "";

    if ((b.version || 0) >= 3) {
      // v3: 첫 화면은 한 줄, 오늘 볼 것(0~3개), 위험 신호. 매크로·종목·시장 수치는 '자세히' 안에.
      const today = (Array.isArray(b.today) ? b.today : []).slice(0, 3).map((t) => `<li>

      const strip = live && isToday ? liveStrip : signalStrip(b.signals, `${b.signals && b.signals.asof ? esc(String(b.signals.asof).slice(11, 16)) + " " : ""}브리핑 작성 시점`) || liveStrip;
      const wasOpen = !!el.querySelector("details.more[open]");   // 다시 그려도 펼친 상태를 유지한다
      const shortThesis = th.length ? `<div class="sheet"><h2>요약</h2>${thesis}</div>` : "";
      el.innerHTML = `

  // ── 투자 성향 탭 ───────────────────────────────────────
  const METRIC_LABEL = { pnl: "평가 손익", total: "총 평가금액" };
  // 계좌별 기록: 실시간 응답이 있으면 그것을, 없으면 저장소에 보관해 둔 것을 쓴다
  const ACCT_LABEL = { all: "전체", upbit: "업비트", kiwoom: "키움" };
  function upbitData() {
    if (S.live && Array.isArray(S.live.fills)) return { fills: S.live.fills, flows: S.live.flows || [], summary: S.live.flows_summary || null };
    const L = S.ledger;
    return L && Array.isArray(L.items) ? { fills: L.items, flows: L.flows || [], summary: L.flows_summary || null } : null;

  function kiwoomData() {
